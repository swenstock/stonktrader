name: Apply Basket Real Execution Push
on:
  push:
    branches:
      - basket-real-execution-v1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: basket-real-execution-v1
          fetch-depth: 0
      - run: git fetch origin main
      - run: git show origin/main:public/v45-basket-builder-v19.js > public/v45-basket-builder-v19.js
      - run: git show origin/main:package.json > package.json
      - run: node scripts/apply-basket-real-execution-temp.js
      - run: node --check public/v45-basket-builder-v19.js
      - run: node server/basketRealExecutionStageB.test.js
      - name: Commit verified repair
        run: |
          rm .github/workflows/apply-basket-real-execution-push.yml
          rm scripts/apply-basket-real-execution-temp.js
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Stage B: persist basket trades to real active portfolio"
          git push origin HEAD:basket-real-execution-v1
