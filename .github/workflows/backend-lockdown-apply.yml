name: Backend Lockdown Apply

on:
  push:
    branches: [backend-lockdown-release]
    paths:
      - '.github/workflows/backend-lockdown-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend-lockdown-release
          fetch-depth: 0
      - name: Reassemble and verify patch
        run: |
          cat scripts/BACKEND_LOCKDOWN_RELEASE.patch.part* > /tmp/backend-lockdown.patch
          git apply --check /tmp/backend-lockdown.patch
      - name: Apply authoritative lockdown patch
        run: git apply /tmp/backend-lockdown.patch
      - name: Remove transport-only files
        run: |
          rm -f scripts/BACKEND_LOCKDOWN_RELEASE.patch.part*
          rm -f .github/workflows/backend-lockdown-apply.yml
      - name: Commit lockdown product tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Backend lockdown: canonical economics and Main Event retirement'
          git push origin HEAD:backend-lockdown-release
