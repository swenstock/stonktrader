name: Legacy Portfolio Schema Migration
on:
  pull_request:
    paths:
      - "server/legacyPortfolioSchemaMigration.js"
      - "server/legacyPortfolioSchemaMigration.test.js"
      - "server/schemaV45.js"
      - "server/db.js"
      - "data/app.db"
      - ".github/workflows/legacy-portfolio-schema-migration.yml"
  workflow_dispatch:

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Legacy schema migration regression
        run: node server/legacyPortfolioSchemaMigration.test.js
