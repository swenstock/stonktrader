name: Stage 54 Analytics Ownership Lock
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/v45-desktop-stage43-v48.js'
      - 'scripts/validate-stage54-analytics-ownership.js'
      - '.github/workflows/stage54-analytics-ownership.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-stage54-analytics-ownership.js
