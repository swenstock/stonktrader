name: Stage 48 Compact Header Analytics

on:
  pull_request:
    paths:
      - 'public/v45-desktop-stage48-v53.js'
      - 'public/v45-desktop-stage48-v53.css'
      - 'public/v45-desktop-stage46-v51-pre.js'
      - 'scripts/validate-stage48-header-analytics.js'
      - '.github/workflows/stage48-header-analytics.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-stage48-header-analytics.js
