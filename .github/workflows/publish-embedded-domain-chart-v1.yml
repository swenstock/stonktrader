name: Publish Embedded Domain Chart V1
on:
  push:
    branches: [embedded-domain-chart-v1]
    paths: ['.github/workflows/publish-embedded-domain-chart-v1.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: embedded-domain-chart-v1
      - name: Wire embedded chart and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/index.js'); s=p.read_text()
          anchor='<script src="/v45-desktop-stage45-v50.js?v=56"></script>'
          addition=anchor+'<script src="/v45-embedded-domain-chart-v1.js?v=1"></script>'
          if '/v45-embedded-domain-chart-v1.js?v=1' not in s:
              if anchor not in s: raise SystemExit('stage45 asset anchor missing')
              s=s.replace(anchor,addition)
          s=s.replace('chartInteractions: "v56-stable-pan-session-bars"','chartInteractions: "v58-embedded-domain-canvas"')
          p.write_text(s)

          p=Path('package.json'); s=p.read_text()
          if 'test:embedded-domain-chart-v1' not in s:
              s=s.replace('"test": "npm run test:chart-presentation-consolidation-v1', '"test": "npm run test:embedded-domain-chart-v1 && npm run test:chart-presentation-consolidation-v1')
              anchor='"test:chart-presentation-consolidation-v1": "node server/chartPresentationConsolidationV1.test.js"'
              if anchor not in s: raise SystemExit('package chart test anchor missing')
              s=s.replace(anchor,'"test:embedded-domain-chart-v1": "node server/embeddedDomainChartV1.test.js",\n    '+anchor)
          p.write_text(s)
          PY
      - name: Focused tests
        run: |
          node server/embeddedDomainChartV1.test.js
          node server/chartPresentationConsolidationV1.test.js
          node --check public/v45-embedded-domain-chart-v1.js
          node --check server/index.js
      - name: Commit clean feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-embedded-domain-chart-v1.yml
          git add public/v45-embedded-domain-chart-v1.js server/embeddedDomainChartV1.test.js server/index.js package.json
          git commit -m 'Use embedded domain-owned desktop chart'
          git push origin HEAD:embedded-domain-chart-v1
