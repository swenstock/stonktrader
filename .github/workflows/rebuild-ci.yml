name: V45 Rebuild CI

on:
  push:
    branches: [v45-rebuild]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Syntax check JavaScript
        run: |
          find server -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check public/v45/v45.js
          node --check public/v45/v45-links.js
          node --check public/v45/trade.js
          node --check public/v45/leaders.js
          node --check public/v45-mycontest-entry-sync-v7.js
          node --check public/v45-advanced-orders-v15.js
          node --check public/v45-trade-ui-polish-v16.js
          node --check public/v45-basket-builder-v19.js
          node --check public/v45-stage85-ui.js
          node --check public/v45-entry-actions-v20.js
          node --check public/v45-mycontest-native-position-v27.js
          node --check public/v45-view-landings-v29.js
          node --check public/v45-leaderboard-v30.js
          node --check public/v45-leaderboard-order-v31.js
          node --check public/v45-ticket-market-v35.js
          node --check public/v45-ticket-market-v36.js
          node --check public/v45-my-tickets-cleanup-v37.js
          node --check public/v45-ticket-settlement-v38.js
          node --check public/v45-ticket-recent-v40.js
          node --check public/v45-ticket-native-hooks-v41.js
          node --check public/v45-native-orders-v45.js
          node --check public/v45-desktop-trading-v45.js
          node --check public/v45-price-sync-v1.js
          node --check public/v45-queue-confirm-rescue-v1.js
          node --check public/v45-queued-activity-v1.js
          node --check scripts/validate-native-mycontest-flow.js
          node --check scripts/validate-stage17-ui.js
          node --check scripts/validate-stage18-ui.js
          node --check scripts/validate-stage19-order.js
          node --check scripts/validate-stage22-leaderboard.js
          node --check scripts/validate-stage23-ticket-market.js
          node --check scripts/validate-stage24-ticket-market.js
          node --check scripts/validate-stage25-basket.js
          node --check scripts/validate-stage26-my-tickets.js
          node --check scripts/validate-stage27-ticket-settlement.js
          node --check scripts/validate-stage31-ticket-native.js
          node --check scripts/validate-stage39-desktop-trading.js
          node --check scripts/validate-stage41-desktop-refine.js
          node --check scripts/validate-portfolio-stability-v1.js
          node --check scripts/v45-smoke.mjs
      - name: Validate native My Contests flow
        run: node scripts/validate-native-mycontest-flow.js
      - name: Validate basket context and view landings
        run: node scripts/validate-stage17-ui.js
      - name: Validate Stage 18 leaderboard and basket polish
        run: node scripts/validate-stage18-ui.js
      - name: Validate Stage 19 leaderboard order
        run: node scripts/validate-stage19-order.js
      - name: Validate Stage 22 popup-only leaderboard
        run: node scripts/validate-stage22-leaderboard.js
      - name: Validate Stage 23 ticket exchange controls
        run: node scripts/validate-stage23-ticket-market.js
      - name: Validate Stage 24 ticket exchange completion
        run: node scripts/validate-stage24-ticket-market.js
      - name: Validate Stage 25 basket rules
        run: node scripts/validate-stage25-basket.js
      - name: Validate Stage 26 My Tickets cleanup
        run: node scripts/validate-stage26-my-tickets.js
      - name: Validate Stage 27 ticket settlement
        run: node scripts/validate-stage27-ticket-settlement.js
      - name: Validate Stage 31 native ticket exchange lifecycle
        run: node scripts/validate-stage31-ticket-native.js
      - name: Validate desktop trading workspace
        run: node scripts/validate-stage39-desktop-trading.js
      - name: Validate Stage 41 desktop refinement
        run: node scripts/validate-stage41-desktop-refine.js
      - name: Validate portfolio stability and queued activity
        run: node scripts/validate-portfolio-stability-v1.js
      - name: Unit tests
        run: npm test
      - name: Server/API/frontend smoke test
        env:
          TEST_MODE: 'true'
          PAYOUT_ENGINE_V45: 'true'
          DB_PATH: /tmp/sbc-v45-ci.db
          PORT: '3456'
        run: |
          node server/index.js > /tmp/sbc-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          READY=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3456/api/health >/dev/null 2>&1; then READY=1; break; fi
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 0.5
          done
          if [ "$READY" != "1" ]; then
            echo '--- SBC SERVER STARTUP LOG ---'
            cat /tmp/sbc-server.log || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:3456/api/health >/tmp/health.json
          node -e "const h=require('/tmp/health.json'); const required=['entryTradeHandoff','tradeUiPolish','priceSync','basketStability','queuedConfirm','queuedActivity','portfolioStability','createABasket','viewLandings','leaderboardUi','leaderboardOrder','leaderboardPortraits','leaderboardPlacement','ticketExchangeControls','myTicketsCleanup','basketControls','desktopTrading','uiCleanup']; if(h.satellitePayoutEngine!=='v45'||required.some(k=>!h[k])) process.exit(1)"
          curl -fsS http://127.0.0.1:3456/api/config >/tmp/config.json
          curl -fsS http://127.0.0.1:3456/api/economics >/tmp/economics.json
          curl -fsS 'http://127.0.0.1:3456/api/sim-market/quotes?symbols=NVDA,MSFT' >/tmp/quotes.json
          curl -fsS http://127.0.0.1:3456/ >/tmp/enhanced.html
          curl -fsS http://127.0.0.1:3456/v45/ >/tmp/v45.html
          curl -fsS 'http://127.0.0.1:3456/v45/trade.html?id=1' >/tmp/trade.html
          curl -fsS http://127.0.0.1:3456/v45/leaders.html >/tmp/leaders.html
          grep -q "CAN'T" /tmp/v45.html
          grep -q 'TICKET EXCHANGE' /tmp/v45.html
          grep -q 'QUICK EXECUTION' /tmp/trade.html
          grep -q 'marketChart' /tmp/trade.html
          grep -q 'JUMP TO ME' /tmp/leaders.html
          grep -q 'JUMP TO MONEY LINE' /tmp/leaders.html
          grep -q 'v45-mycontest-native-position-v27.js' /tmp/enhanced.html
          grep -Eq 'v45-trade-ui-polish-v16.js\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-price-sync-v1.js\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-queue-confirm-rescue-v1.js\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-basket-stability-v1.css\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-desktop-stage46-v51-pre.js\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-basket-builder-v19.js\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-stage85-ui.js\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-desktop-trading-v45.js\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-desktop-refine-v46.css\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-view-landings-v29.js\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-leaderboard-v30.js\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-leaderboard-v30.css\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-leaderboard-order-v31.js\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-ticket-market-v36.js\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-my-tickets-cleanup-v37.js\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-ticket-market-v35.js\?v=[0-9]+' /tmp/enhanced.html
          grep -Eq 'v45-ticket-market-v35.css\?v=[0-9]+' /tmp/enhanced.html
          if grep -q 'v45-entry-flow-v25.js' /tmp/enhanced.html; then echo 'legacy entry flow still injected'; exit 1; fi
          node -e "const q=require('/tmp/quotes.json'); if(q.length!==2||q.some(x=>x.source!=='sim')) process.exit(1)"
          SBC_BASE_URL=http://127.0.0.1:3456/api node scripts/v45-smoke.mjs
