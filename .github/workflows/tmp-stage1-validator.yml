name: Temporary Stage 1 validator reconciliation
on:
  push:
    branches:
      - exchange-cleanup-stage1-static-load
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Update Stage 26 validator for static Exchange bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update stale bootstrap assertions only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate-stage26-my-tickets.js')
          s=p.read_text()
          replacements={
          "must(ui.includes('/v45-ticket-native-hooks-v41.js?v=49'),'runtime-owner hook is cache-busted by My Tickets fallback loader');":"must(server.includes('/v45-ticket-native-hooks-v41.js?v=49')&&server.includes('/v45-my-tickets-cleanup-v37.js?v=41'),'runtime-owner hook and My Tickets cleanup are statically loaded by the server');",
          "must(ui.includes('/v45-test-stonk-faucet-v1.js?v=1'),'TEST STONK faucet remains available through Exchange QA tools');":"must(server.includes('/v45-test-stonk-faucet-v1.js?v=3'),'TEST STONK faucet remains available through the static Exchange bootstrap');",
          "must(stageC.includes('/v45-exchange-dialog-v1.js?v=5')&&stageC.includes('/v45-test-stonk-faucet-v1.js?v=3')&&stageC.includes('/v45-exchange-own-orders-v1.js?v=8'),'final direct UI owner boots cache-busted Exchange dialogs before QA and own-order helpers');":"must(server.includes('/v45-exchange-dialog-v1.js?v=5')&&server.includes('/v45-test-stonk-faucet-v1.js?v=3')&&server.includes('/v45-exchange-own-orders-v1.js?v=8'),'server statically boots cache-busted Exchange dialogs, QA, and own-order helpers');",
          "must(dialog.includes('/v45-exchange-routing-fill-v1.js?v=4')&&dialog.includes('/v45-exchange-tier-integrity-v1.js?v=3'),'dialog bootstrap loads cache-busted routing/fill and tier-integrity guards');":"must(server.includes('/v45-exchange-routing-fill-v1.js?v=4')&&server.includes('/v45-exchange-tier-integrity-v1.js?v=3'),'server static bootstrap loads cache-busted routing/fill and tier-integrity guards');",
          "must(dialog.includes('/v45-exchange-my-activity-v1.js?v=3')&&dialog.includes('data-sbc-exchange-my-activity'),'dialog bootstrap loads the cache-busted Exchange My Activity blotter');":"must(server.includes('/v45-exchange-my-activity-v1.js?v=3'),'server static bootstrap loads the cache-busted Exchange My Activity blotter');",
          "must(dialog.includes('/v45-exchange-layout-sales-v1.js?v=2')&&dialog.includes('data-sbc-exchange-layout-sales'),'dialog bootstrap loads the cache-busted Exchange bottom-layout/recent-sales guard');":"must(server.includes('/v45-exchange-layout-sales-v1.js?v=2'),'server static bootstrap loads the cache-busted Exchange bottom-layout/recent-sales guard');",
          "must(dialog.includes('/v45-badge-ownership-sync-v1.js?v=2')&&dialog.includes('data-sbc-badge-ownership-sync'),'dialog bootstrap directly loads authoritative Badge ownership sync');":"must(server.includes('/v45-badge-ownership-sync-v1.js?v=2'),'server static bootstrap directly loads authoritative Badge ownership sync');"
          }
          for old,new in replacements.items():
              assert old in s, old
              s=s.replace(old,new,1)
          marker="must(!ui.includes(\"createElement('script')\")&&!dialog.includes(\"createElement('script')\")&&!integrity.includes(\"createElement('script')\")&&!stageC.includes(\"createElement('script')\"),'Stage 1 removes dynamic script injection from the four former bootstrap owners');\n"
          anchor="must(server.includes('/v45-exchange-dialog-v1.js?v=5')&&server.includes('/v45-exchange-layout-sales-v1.js?v=2'),'server serves cache-busted Exchange dialog and layout helpers');\n"
          assert anchor in s
          s=s.replace(anchor,marker+anchor,1)
          p.write_text(s)
          PY
      - name: Validate reconciled Stage 26 and Stage 1 guards
        run: |
          node scripts/validate-stage26-my-tickets.js
          node server/stageCUiCleanupV1.test.js
          node server/ticketExchangeStage4Ui.test.js
          node server/ticketExchangeStage4AcceptanceV3.test.js
      - name: Commit validator-only maintenance
        run: |
          rm .github/workflows/tmp-stage1-validator.yml
          git config user.name "swenstock"
          git config user.email "swenstock@gmail.com"
          git add scripts/validate-stage26-my-tickets.js .github/workflows/tmp-stage1-validator.yml
          git commit -m "Update Stage 26 validator for static Exchange bootstrap"
          git push origin HEAD:exchange-cleanup-stage1-static-load
