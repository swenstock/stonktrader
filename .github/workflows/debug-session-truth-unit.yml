name: Debug Session Truth Unit
on:
  push:
    branches: [session-leaderboard-truth-v1]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Capture unit output
        run: |
          set +e
          npm test > unit-output.txt 2>&1
          CODE=$?
          echo "$CODE" > unit-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: session-truth-unit-output
          path: |
            unit-output.txt
            unit-exit-code.txt
