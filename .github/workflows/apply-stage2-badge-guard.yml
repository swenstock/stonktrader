name: Apply Stage 2 Badge Hook Guard
on:
  push:
    branches: [exchange-cleanup-stage2-observers]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exchange-cleanup-stage2-observers
      - name: Guard Badge render hook for minimal VM window
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/v45-badge-market-stage4.js')
          s=p.read_text()
          old="window.addEventListener('sbc:exchange-rendered',()=>{ensureBadgeSlot();syncModeToActiveTab()});"
          new="if(typeof window.addEventListener==='function')window.addEventListener('sbc:exchange-rendered',()=>{ensureBadgeSlot();syncModeToActiveTab()});"
          if s.count(old)!=1: raise SystemExit(f'expected one Badge hook, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          if 'MutationObserver' in p.read_text(): raise SystemExit('MutationObserver returned')
          PY
      - name: Commit guard and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/apply-stage2-badge-guard.yml
          git add public/v45-badge-market-stage4.js .github/workflows/apply-stage2-badge-guard.yml
          git commit -m 'Guard Stage 2 Badge render hook in minimal VM contexts'
          git push origin HEAD:exchange-cleanup-stage2-observers
