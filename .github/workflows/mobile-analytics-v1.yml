name: Mobile Analytics V1

on:
  pull_request:
    paths:
      - 'public/v45-mobile-v4.js'
      - 'public/v45-mobile-v6.js'
      - 'public/v45-mobile-v6.css'
      - 'server/mobileAnalyticsV1.test.js'
      - 'scripts/validate-stage35-mobile-round2.js'
      - '.github/workflows/mobile-analytics-v1.yml'
  workflow_dispatch:

jobs:
  mobile-analytics-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Syntax check mobile Analytics
        run: |
          node --check public/v45-mobile-v4.js
          node --check public/v45-mobile-v6.js
          node --check server/mobileAnalyticsV1.test.js
          node --check scripts/validate-stage35-mobile-round2.js
      - name: Behavioral mobile Analytics test
        run: node server/mobileAnalyticsV1.test.js
      - name: Stage 35 compatibility validation
        run: node scripts/validate-stage35-mobile-round2.js
