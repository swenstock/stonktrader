name: Stage 56 Native Analytics Signature
on:
  pull_request:
    branches: [ main ]
jobs:
  validate-stage56:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate real analytics module signatures
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='public/v45-desktop-stage51-v55.js';
          const s=fs.readFileSync(p,'utf8');
          const must=['EQUITY CURVE','ALLOCATION BREAKDOWN','P&L DRIVERS','VS. PRIZE LINE','CASH DEPLOYMENT','RANK MOVEMENT','function hasNativeSignature','function findNativeModule'];
          for(const x of must){if(!s.includes(x))throw new Error('Missing Stage56 signature guard: '+x)}
          if(!s.includes("if(marked&&hasNativeSignature(marked,kind))return marked"))throw new Error('Marked source must be signature-valid');
          console.log('Stage 56 native analytics signature validation passed');
          NODE