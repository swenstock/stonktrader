name: Apply Stage 6 Item C API v3
on:
  push:
    branches: [stage6-item-c-api-counterparties]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-item-c-api-counterparties
      - name: Add display names to recent trade API payloads
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing exact target in {path}: {old[:120]}')
              if s.count(old)!=1: raise SystemExit(f'expected one target in {path}, found {s.count(old)}')
              p.write_text(s.replace(old,new,1))

          old="  const offers = db.prepare(`\n    SELECT l.id, l.ticket_id ticketId, t.ticket_type ticketType, l.ask_price price,\n      l.platform_fee_stonk platformFee, l.sold_at executedAt, 'offer' source\n    FROM ticket_listings l\n    JOIN tickets t ON t.id = l.ticket_id\n    WHERE l.status='sold' AND t.ticket_type=? AND l.sold_at IS NOT NULL\n    ORDER BY l.sold_at DESC LIMIT 20\n  `).all(ticketType);\n  const bids = db.prepare(`\n    SELECT b.id, b.filled_ticket_id ticketId, b.ticket_type ticketType, b.bid_price price,\n      b.platform_fee_stonk platformFee, b.filled_at executedAt, 'bid' source\n    FROM ticket_bids b\n    WHERE b.status='filled' AND b.ticket_type=? AND b.filled_at IS NOT NULL\n    ORDER BY b.filled_at DESC LIMIT 20\n  `).all(ticketType);"
          new="  const offers = db.prepare(`\n    SELECT l.id, l.ticket_id ticketId, t.ticket_type ticketType, l.ask_price price,\n      l.platform_fee_stonk platformFee, l.sold_at executedAt, 'offer' source,\n      buyer.display_name buyerDisplayName, seller.display_name sellerDisplayName\n    FROM ticket_listings l\n    JOIN tickets t ON t.id = l.ticket_id\n    JOIN accounts buyer_account ON buyer_account.id = l.buyer_account_id\n    JOIN users buyer ON buyer.id = buyer_account.user_id\n    JOIN accounts seller_account ON seller_account.id = l.seller_account_id\n    JOIN users seller ON seller.id = seller_account.user_id\n    WHERE l.status='sold' AND t.ticket_type=? AND l.sold_at IS NOT NULL\n    ORDER BY l.sold_at DESC LIMIT 20\n  `).all(ticketType);\n  const bids = db.prepare(`\n    SELECT b.id, b.filled_ticket_id ticketId, b.ticket_type ticketType, b.bid_price price,\n      b.platform_fee_stonk platformFee, b.filled_at executedAt, 'bid' source,\n      buyer.display_name buyerDisplayName, seller.display_name sellerDisplayName\n    FROM ticket_bids b\n    JOIN accounts buyer_account ON buyer_account.id = b.buyer_account_id\n    JOIN users buyer ON buyer.id = buyer_account.user_id\n    JOIN accounts seller_account ON seller_account.id = b.seller_account_id\n    JOIN users seller ON seller.id = seller_account.user_id\n    WHERE b.status='filled' AND b.ticket_type=? AND b.filled_at IS NOT NULL\n    ORDER BY b.filled_at DESC LIMIT 20\n  `).all(ticketType);"
          replace('server/routes/ticketMarket.js',old,new)

          old="    .map(x=>({ id:Number(x.id), ticketId:x.ticketId==null?null:Number(x.ticketId), ticketType:x.ticketType, price:Number(x.price), platformFee:Number(x.platformFee||0), executedAt:x.executedAt, source:x.source }));"
          new="    .map(x=>({ id:Number(x.id), ticketId:x.ticketId==null?null:Number(x.ticketId), ticketType:x.ticketType, price:Number(x.price), platformFee:Number(x.platformFee||0), executedAt:x.executedAt, source:x.source, buyerDisplayName:x.buyerDisplayName, sellerDisplayName:x.sellerDisplayName }));"
          replace('server/routes/ticketMarket.js',old,new)

          old="  const recent = db.prepare(`SELECT * FROM badge_trades ORDER BY id DESC LIMIT 20`).all();"
          new="  const recent = db.prepare(`SELECT t.*, buyer.display_name buyer_display_name, seller.display_name seller_display_name\\n    FROM badge_trades t\\n    JOIN accounts buyer_account ON buyer_account.id=t.buyer_account_id\\n    JOIN users buyer ON buyer.id=buyer_account.user_id\\n    JOIN accounts seller_account ON seller_account.id=t.seller_account_id\\n    JOIN users seller ON seller.id=seller_account.user_id\\n    ORDER BY t.id DESC LIMIT 20`).all();"
          new=new.replace('\\\\n','\\n')
          replace('server/badgeMarketV45.js',old,new)

          old="    recentTrades: recent.map(x => ({ id:Number(x.id), price:Number(x.price_stonk), fee:Number(x.platform_fee_stonk), createdAt:x.created_at })),"
          new="    recentTrades: recent.map(x => ({ id:Number(x.id), price:Number(x.price_stonk), fee:Number(x.platform_fee_stonk), createdAt:x.created_at, buyerDisplayName:x.buyer_display_name, sellerDisplayName:x.seller_display_name })),"
          replace('server/badgeMarketV45.js',old,new)
      - name: Syntax check
        run: |
          node --check server/routes/ticketMarket.js
          node --check server/badgeMarketV45.js
      - name: Commit API-only change and remove temporary workflows
        run: |
          rm -f .github/workflows/apply-stage6-item-c-api.yml .github/workflows/apply-stage6-item-c-api-v2.yml .github/workflows/apply-stage6-item-c-api-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routes/ticketMarket.js server/badgeMarketV45.js .github/workflows/apply-stage6-item-c-api.yml .github/workflows/apply-stage6-item-c-api-v2.yml .github/workflows/apply-stage6-item-c-api-v3.yml
          git commit -m 'Stage 6 Item C API: expose trade counterpart display names'
          git push origin HEAD:stage6-item-c-api-counterparties