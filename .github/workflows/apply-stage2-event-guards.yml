name: Apply Stage 2 Event Hook Guards
on:
  push:
    branches: [exchange-cleanup-stage2-observers]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exchange-cleanup-stage2-observers
      - name: Guard all Stage 2 render listeners for minimal VM windows
        run: |
          python - <<'PY'
          from pathlib import Path
          targets=[
            'public/v45-exchange-tier-integrity-v1.js',
            'public/v45-exchange-layout-sales-v1.js',
            'public/v45-ticket-market-v36.js',
            'public/v45-ticket-market-v35.js',
            'public/v45-my-tickets-cleanup-v37.js',
            'public/v45-ticket-settlement-v38.js',
            'public/v45-ticket-recent-v40.js',
          ]
          for name in targets:
              p=Path(name); s=p.read_text()
              needle="window.addEventListener('sbc:exchange-rendered'"
              guarded="if(typeof window.addEventListener==='function')window.addEventListener('sbc:exchange-rendered'"
              if guarded in s:
                  continue
              if needle not in s:
                  raise SystemExit(f'{name}: Stage 2 render listener not found')
              s=s.replace(needle,guarded,1)
              p.write_text(s)
          all8=targets+['public/v45-badge-market-stage4.js']
          bad=[p for p in all8 if 'MutationObserver' in Path(p).read_text()]
          if bad: raise SystemExit('MutationObserver returned: '+', '.join(bad))
          print('PASS: all Stage 2 render listeners VM-safe; zero MutationObserver in all 8 targets')
          PY
      - name: Commit guards and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/apply-stage2-event-guards.yml
          git add public/v45-exchange-tier-integrity-v1.js public/v45-exchange-layout-sales-v1.js public/v45-ticket-market-v36.js public/v45-ticket-market-v35.js public/v45-my-tickets-cleanup-v37.js public/v45-ticket-settlement-v38.js public/v45-ticket-recent-v40.js .github/workflows/apply-stage2-event-guards.yml
          git commit -m 'Guard Stage 2 render hooks in minimal VM contexts'
          git push origin HEAD:exchange-cleanup-stage2-observers
