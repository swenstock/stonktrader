name: Vendor Lightweight Charts V1
on:
  push:
    branches: [mature-chart-owner-v1]
    paths: ['.github/workflows/vendor-lightweight-charts-v1.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mature-chart-owner-v1
      - name: Vendor pinned chart bundle
        run: |
          set -euo pipefail
          mkdir -p public/vendor /tmp/lwc
          cd /tmp/lwc
          npm pack lightweight-charts@4.2.3 >/tmp/lwc-pack.txt
          TGZ=$(tail -n1 /tmp/lwc-pack.txt)
          tar -xzf "$TGZ"
          cd "$GITHUB_WORKSPACE"
          cp /tmp/lwc/package/dist/lightweight-charts.standalone.production.js public/vendor/lightweight-charts-4.2.3.js
          test -s public/vendor/lightweight-charts-4.2.3.js
          grep -q 'LightweightCharts' public/vendor/lightweight-charts-4.2.3.js
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/vendor-lightweight-charts-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/vendor/lightweight-charts-4.2.3.js .github/workflows/vendor-lightweight-charts-v1.yml
          git commit -m 'Vendor Lightweight Charts 4.2.3'
          git push origin HEAD:mature-chart-owner-v1
