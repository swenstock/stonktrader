name: Stage 6 Exchange artwork proof

on:
  push:
    branches: [stage6-exchange-artwork]

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove assembled shell artwork implementation
        run: |
          node <<'NODE'
          const { exactV45Shell } = require('./server/v45ExactShell');
          const s = exactV45Shell.toString('utf8');
          function functionBlock(name){const a=s.indexOf('function '+name+'(');if(a<0)throw new Error('missing '+name);const b=s.indexOf('\nfunction ',a+10);return s.slice(a,b>a?b:a+3000)}
          console.log('=== TIER_DATA OCCURRENCES ===');
          let from=0,count=0;
          while(true){const i=s.indexOf('TIER_DATA',from);if(i<0)break;count++;console.log('--- occurrence '+count+' @ '+i+' ---');console.log(s.slice(Math.max(0,i-900),Math.min(s.length,i+1800)));from=i+9;}
          console.log('TIER_DATA literal occurrences =>',count);
          console.log('=== getExchangeTicketVisual ===');
          console.log(functionBlock('getExchangeTicketVisual'));
          console.log('=== exchangeVisualHTML ===');
          console.log(functionBlock('exchangeVisualHTML'));
          console.log('=== hydrateExchangeTierIcons ===');
          console.log(functionBlock('hydrateExchangeTierIcons'));
          console.log('=== FUNCTION COUNTS ===');
          console.log('getExchangeTicketVisual =>', (s.match(/function getExchangeTicketVisual\(/g)||[]).length);
          console.log('exchangeVisualHTML =>', (s.match(/function exchangeVisualHTML\(/g)||[]).length);
          console.log('hydrateExchangeTierIcons =>', (s.match(/function hydrateExchangeTierIcons\(/g)||[]).length);
          NODE
