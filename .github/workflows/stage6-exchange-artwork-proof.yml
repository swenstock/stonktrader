name: Stage 6 Exchange artwork proof

on:
  push:
    branches: [stage6-exchange-artwork]

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check production response headers for image policy
        run: |
          set -euo pipefail
          curl -sS -L -D /tmp/headers.txt -o /tmp/prod.html https://stonkbrokerchallenge.com/
          echo '=== FINAL RESPONSE HEADERS ==='
          cat /tmp/headers.txt
          echo '=== SECURITY HEADER FILTER ==='
          grep -iE '^(content-security-policy|content-security-policy-report-only|x-content-type-options|cross-origin-resource-policy|cross-origin-opener-policy|cross-origin-embedder-policy|content-type|server|via|x-render|cf-|x-cache|cache-control):' /tmp/headers.txt || true
          echo '=== HTML CSP META COUNTS ==='
          printf 'Content-Security-Policy => '; grep -oi 'Content-Security-Policy' /tmp/prod.html | wc -l
          printf 'img-src => '; grep -oi 'img-src' /tmp/prod.html | wc -l
          printf 'data:image/png;base64 => '; grep -o 'data:image/png;base64' /tmp/prod.html | wc -l
