name: Stage 6 Exchange artwork proof

on:
  push:
    branches: [stage6-exchange-artwork]

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check assembled shell image security and mutations
        run: |
          node <<'NODE'
          const { exactV45Shell } = require('./server/v45ExactShell');
          const s=exactV45Shell.toString('utf8');
          for(const term of ['Content-Security-Policy','content-security-policy','img-src','default-src']){
            const matches=[];let from=0;while(true){const i=s.indexOf(term,from);if(i<0)break;matches.push(i);from=i+term.length;}
            console.log(term+' => '+matches.length, matches);
            matches.forEach(i=>console.log(s.slice(Math.max(0,i-300),Math.min(s.length,i+600))));
          }
          console.log('=== all TIER_DATA art assignments ===');
          const lines=s.split('\n');
          lines.forEach((line,i)=>{if(/TIER_DATA.*\.art|\.src\s*=.*TIER_DATA|tierArt/.test(line))console.log((i+1)+': '+line.trim())});
          console.log('=== exchange art img creation ===');
          lines.forEach((line,i)=>{if(/book-tier-art|exchangeFilter.*Art|exchangeInv.*Art/.test(line))console.log((i+1)+': '+line.trim())});
          NODE
