name: Cleanup corporate ladder release

on:
  push:
    branches: [corporate-ladder-badge-ticket-consolidation]
    paths:
      - '.github/workflows/cleanup-corporate-ladder-release.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove release-only artifacts
        run: |
          git rm -r --cached --ignore-unmatch node_modules
          rm -rf node_modules
          git rm --ignore-unmatch CLAUDE_PREMERGE_CORPORATE_LADDER_HANDOFF.md
          rm -f .github/workflows/cleanup-corporate-ladder-release.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean release-only build artifacts"
          git push origin HEAD:corporate-ladder-badge-ticket-consolidation
