name: Stage 6 Badge JSON diff cleanup

on:
  push:
    branches: [stage6-badge-json-boundary]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-badge-json-boundary
          fetch-depth: 0
      - name: Restore unrelated package description byte form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('package.json')
          s=p.read_text()
          old='"description": "Multi-user paper trading contest platform — real accounts, simulated/live-ready quotes, positions, leaderboard, and contest lifecycle."'
          new='"description": "Multi-user paper trading contest platform \\u2014 real accounts, simulated/live-ready quotes, positions, leaderboard, and contest lifecycle."'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git diff -- package.json
      - name: Commit source-only cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage6-badge-json-cleanup.yml
          git add package.json
          git commit -m "Remove unrelated package formatting noise"
          git push origin HEAD:stage6-badge-json-boundary
