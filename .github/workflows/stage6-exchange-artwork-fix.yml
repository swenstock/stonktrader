name: Stage 6 Exchange artwork compatibility builder

on:
  push:
    branches: [stage6-exchange-artwork]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-exchange-artwork
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch canonical display labels to shell visual labels
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='public/v45-ticket-market-v36.js';
          let s=fs.readFileSync(p,'utf8');
          const labels="const TYPE_LABELS={junior:'JR BROKER',trader:'TRADER',clerk:'CLERK',runner:'RUNNER'};";
          if((s.split(labels).length-1)!==1)throw new Error('TYPE_LABELS anchor mismatch');
          s=s.replace(labels,labels+"\nconst VISUAL_LABELS={junior:'Jr. StonkBroker',trader:'Trader',clerk:'Clerk',runner:'Runner'};\nfunction visualLabel(type){return VISUAL_LABELS[type]||TYPE_LABELS[type]||type}");
          const decl="const type=book?.ticketType||marketTypeFromName(typeof activeTicketMarket!=='undefined'?activeTicketMarket:'RUNNER'),name=TYPE_LABELS[type]||type;";
          const declNew="const type=book?.ticketType||marketTypeFromName(typeof activeTicketMarket!=='undefined'?activeTicketMarket:'RUNNER'),name=TYPE_LABELS[type]||type,artName=visualLabel(type);";
          if((s.split(decl).length-1)!==1)throw new Error('render declaration anchor mismatch');
          s=s.replace(decl,declNew);
          const titleOld="exchangeVisualHTML(name):'';title.innerHTML";
          const titleNew="exchangeVisualHTML(artName):'';title.innerHTML";
          if((s.split(titleOld).length-1)!==1)throw new Error('title artwork anchor mismatch');
          s=s.replace(titleOld,titleNew);
          const visualOld="const visual=()=>typeof exchangeVisualHTML==='function'?exchangeVisualHTML(name):'';";
          const visualNew="const visual=()=>typeof exchangeVisualHTML==='function'?exchangeVisualHTML(artName):'';";
          if((s.split(visualOld).length-1)!==1)throw new Error('book artwork anchor mismatch');
          s=s.replace(visualOld,visualNew);
          const recentOld="exchangeVisualHTML(name,'ticket-badge'):''";
          const recentNew="exchangeVisualHTML(artName,'ticket-badge'):''";
          if((s.split(recentOld).length-1)!==1)throw new Error('recent artwork anchor mismatch');
          s=s.replace(recentOld,recentNew);
          fs.writeFileSync(p,s);
          NODE

          cat > server/exchangeArtworkMappingV1.test.js <<'EOF'
          'use strict';
          const assert=require('assert');
          const fs=require('fs');
          const vm=require('vm');
          const { exactV45Shell }=require('./v45ExactShell');
          const runtime=fs.readFileSync('public/v45-ticket-market-v36.js','utf8');
          const shell=exactV45Shell.toString('utf8');
          function objectLiteral(name){
            const m=runtime.match(new RegExp('const '+name+'=(\\{[^;]+\\});'));
            assert(m, name+' mapping missing');
            return vm.runInNewContext('('+m[1]+')');
          }
          const display=objectLiteral('TYPE_LABELS');
          const visual=objectLiteral('VISUAL_LABELS');
          const start=shell.indexOf('const TIER_DATA = '),end=shell.indexOf(';\n',start);
          assert(start>=0&&end>start,'assembled TIER_DATA missing');
          const TIER_DATA=JSON.parse(shell.slice(start+'const TIER_DATA = '.length,end));
          const ctx={TIER_DATA};vm.createContext(ctx);
          for(const fn of ['getExchangeTicketVisual','exchangeVisualHTML']){
            const a=shell.indexOf('function '+fn+'('),b=shell.indexOf('\nfunction ',a+1);
            assert(a>=0&&b>a,fn+' missing from assembled shell');
            vm.runInContext(shell.slice(a,b),ctx);
          }
          for(const type of ['junior','trader','clerk','runner']){
            assert(display[type],type+' display label missing');
            assert(visual[type],type+' visual label missing');
            const html=ctx.exchangeVisualHTML(visual[type]);
            assert(/<img src="data:image\/png;base64,/.test(html),type+' visual must resolve to embedded PNG');
            assert(!/src=""/.test(html),type+' visual must not render empty src');
          }
          assert(runtime.includes("exchangeVisualHTML(artName)"),'book/title renderer must use artName');
          assert(runtime.includes("exchangeVisualHTML(artName,'ticket-badge')"),'recent renderer must use artName');
          assert.strictEqual(display.runner,'RUNNER');
          assert.strictEqual(visual.runner,'Runner');
          assert.strictEqual(display.junior,'JR BROKER');
          assert.strictEqual(visual.junior,'Jr. StonkBroker');
          console.log('Exchange Artwork Mapping V1: PASS');
          console.log('Canonical visible labels remain unchanged while all four real-book artwork calls resolve to valid assembled-shell PNGs.');
          EOF

          node --check public/v45-ticket-market-v36.js
          node --check server/exchangeArtworkMappingV1.test.js
          node server/exchangeArtworkMappingV1.test.js
      - name: Commit source and regression test only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage6-exchange-artwork-proof.yml .github/workflows/stage6-exchange-artwork-fix.yml
          git add public/v45-ticket-market-v36.js server/exchangeArtworkMappingV1.test.js
          git commit -m "Fix Exchange tier artwork label compatibility"
          git push origin HEAD:stage6-exchange-artwork
