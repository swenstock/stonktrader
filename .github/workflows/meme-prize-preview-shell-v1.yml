name: Meme Prize Preview Shell V1

on:
  push:
    branches:
      - 'preview/meme-prize-shell-v1'
  workflow_dispatch:

jobs:
  preview-shell-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Syntax check preview files
        run: |
          node --check server/previewServer.js
          node --check public/preview-og-prize-v1.js
          node --check server/previewMemePrizeShellV1.test.js
      - name: Run preview architecture regression
        run: node server/previewMemePrizeShellV1.test.js
      - name: Run proven workstation regressions
        run: |
          node server/simulatedQuoteEngine.test.js
          node server/tradingWorkstationV1.test.js
          node server/basketRealExecutionStageB.test.js
          node server/matureChartOwnerV1.test.js
      - name: Boot preview server and verify health
        run: |
          PORT=3456 node server/previewServer.js > /tmp/sbc-preview.log 2>&1 &
          pid=$!
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3456/api/preview-health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:3456/ | grep -q 'STONK BROKER CHALLENGE'
          kill $pid || true
