name: Chart Native Domain Test Fix
on:
  push:
    branches: [chart-native-domain-navigation-v1]
    paths: [.github/workflows/chart-native-domain-testfix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chart-native-domain-navigation-v1
          fetch-depth: 0
      - name: Update real-bars authority assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/v45ExactShellRealBars.test.js')
          s=p.read_text()
          a="assert(html.includes(\"if(real&&real.length)return real.slice(-timeframeBars(tf));\\n  const n=timeframeBars(tf);\"), 'real bars must remain authoritative while obeying the visible presentation window before synthetic fallback');"
          b="assert(html.includes(\"if(real&&real.length)return real.slice(-Math.max(timeframeHistoryBars(tf),160));\\n  const n=timeframeHistoryBars(tf);\"), 'real bars must remain authoritative while retaining enough source history for renderer-domain pan/zoom before synthetic fallback');"
          assert a in s
          p.write_text(s.replace(a,b,1))
          PY
          node server/v45ExactShellRealBars.test.js
      - name: Commit test correction and remove publisher
        run: |
          git rm .github/workflows/chart-native-domain-testfix.yml
          git add server/v45ExactShellRealBars.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Update real-bars test for native chart panning"
          git push origin HEAD:chart-native-domain-navigation-v1
