name: Chart Stable Timeframe Pan Publisher
on:
  push:
    branches: [chart-stable-timeframe-pan-v1]
    paths: ['.github/workflows/chart-stable-timeframe-pan-publisher.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chart-stable-timeframe-pan-v1
      - name: Cache bust stable chart interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server/index.js')
          s=p.read_text()
          if '/v45-desktop-stage45-v50.js?v=55' not in s: raise SystemExit('cache anchor missing')
          s=s.replace('/v45-desktop-stage45-v50.js?v=55','/v45-desktop-stage45-v50.js?v=56')
          s=s.replace('chartInteractions: "v54-continuous-grab-pan"','chartInteractions: "v56-stable-pan-session-bars"')
          p.write_text(s)
          PY
      - name: Focused tests
        run: |
          node server/chartStableTimeframePanV1.test.js
          node server/chartPresentationConsolidationV1.test.js
          node --check public/v45-desktop-stage45-v50.js
          node --check server/routes/quoteBars.js
      - name: Commit and remove publisher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chart-stable-timeframe-pan-publisher.yml
          git add server/index.js public/v45-desktop-stage45-v50.js server/routes/quoteBars.js server/chartStableTimeframePanV1.test.js
          git commit -m 'Stabilize chart pan and timeframe real-bars repaint'
          git push origin HEAD:chart-stable-timeframe-pan-v1
