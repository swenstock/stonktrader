name: Stage 45 Chart Stability
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  chart-stage45:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check Stage 45
        run: |
          node --check public/v45-desktop-stage45-v50.js
          node --check scripts/validate-stage45-chart.js
      - name: Validate Stage 45 chart
        run: node scripts/validate-stage45-chart.js
