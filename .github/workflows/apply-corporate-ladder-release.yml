name: Apply corporate ladder release

on:
  push:
    branches: [corporate-ladder-badge-ticket-consolidation]
    paths:
      - '.github/workflows/apply-corporate-ladder-release.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply release bundle
        run: |
          cat .release/cl6.part* | base64 -d > /tmp/corporate.tar.xz
          tar -xJf /tmp/corporate.tar.xz -C .
          rm -rf .release
          rm -f .github/workflows/apply-corporate-ladder-release.yml
      - name: Install locked dependencies
        run: npm ci
      - name: Run full test suite
        run: npm test
      - name: Commit final source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Corporate ladder badge and ticket consolidation"
          git push origin HEAD:corporate-ladder-badge-ticket-consolidation
