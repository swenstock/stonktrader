name: Orders Activity Panel Patch
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orders-activity-panel-fixes
      - run: python3 scripts/apply-orders-activity-fixes.py
      - run: node --check public/v45-advanced-orders-v15.js
      - run: node --check public/v45-desktop-trading-v45.js
      - run: node server/ordersActivityPanelFixes.test.js
      - run: git diff --check
      - run: test -z "$(git diff -- public/v45-native-orders-v45.js)"
      - run: |
          git config user.name swenstock
          git config user.email swenstock@gmail.com
          git add public/v45-advanced-orders-v15.js public/v45-desktop-trading-v45.js server/ordersActivityPanelFixes.test.js package.json
          git rm .github/workflows/apply-orders-activity-panel-fixes.yml .github/workflows/apply-orders-activity-panel-fixes-v2.yml .github/workflows/apply-orders-activity-panel-fixes-v3.yml scripts/apply-orders-activity-fixes.py
          git commit -m "Fix real Sell All and orders activity panel"
          git push origin HEAD:orders-activity-panel-fixes
