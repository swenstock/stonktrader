name: Trace Stage 6 Item B Owner
on:
  push:
    branches: [stage6-item-b-relocate-ladder]
permissions:
  contents: write
jobs:
  trace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-item-b-relocate-ladder
      - name: Find ladder owner
        run: |
          echo '=== COLLECT / MOVE UP / NEED / burnCount matches ==='
          grep -RniE 'COLLECT 10|MOVE UP|NEED [0-9]|burnCount|optional upgrade|TICKETS →' public scripts server --exclude-dir=node_modules || true
      - name: Remove temporary trace workflow
        run: |
          rm .github/workflows/trace-stage6-item-b-owner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/trace-stage6-item-b-owner.yml
          git commit -m 'Remove temporary Stage 6 Item B owner trace workflow'
          git push origin HEAD:stage6-item-b-relocate-ladder