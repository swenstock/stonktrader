name: Apply Orders Activity Fixes V2
on:
  push:
    branches: [orders-activity-panel-fixes]
jobs:
  apply:
    if: github.event.head_commit.message == 'Add minimal orders activity fix runner'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orders-activity-panel-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/apply-orders-activity-fixes.py
      - run: |
          node --check public/v45-advanced-orders-v15.js
          node --check public/v45-desktop-trading-v45.js
          node server/ordersActivityPanelFixes.test.js
          git diff --check
          test -z "$(git diff -- public/v45-native-orders-v45.js)"
      - run: |
          git config user.name swenstock
          git config user.email swenstock@gmail.com
          git add public/v45-advanced-orders-v15.js public/v45-desktop-trading-v45.js server/ordersActivityPanelFixes.test.js package.json
          git rm .github/workflows/apply-orders-activity-panel-fixes.yml .github/workflows/apply-orders-activity-panel-fixes-v2.yml scripts/apply-orders-activity-fixes.py
          git commit -m 'Fix real Sell All and orders activity panel'
          git push origin HEAD:orders-activity-panel-fixes
