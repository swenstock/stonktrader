name: Mature Chart Browser Acceptance
on:
  pull_request:
    paths:
      - "public/v45-mature-chart-owner-v1.js"
      - "public/v45-mature-chart-owner-v1.css"
      - "public/v45-active-symbol-sync-v1.js"
      - "public/v45-desktop-stage45-v50.js"
      - "public/vendor/lightweight-charts-4.2.3.js"
      - "server/index.js"
      - "server/matureChartBrowser.spec.js"
      - "server/matureChartOwnerV1.test.js"
      - ".github/workflows/mature-chart-browser.yml"
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser for acceptance only
        run: npm install --no-save @playwright/test@1.55.0 && npx playwright install --with-deps chromium
      - name: Served Portfolio DOM and scripts
        run: npx playwright test server/matureChartBrowser.spec.js --grep "@shell" --reporter=line --workers=1
      - name: Native chart surface after symbol selection
        if: always()
        run: npx playwright test server/matureChartBrowser.spec.js --grep "@native" --reporter=line --workers=1
      - name: Real shell mount and lifecycle
        if: always()
        run: npx playwright test server/matureChartBrowser.spec.js --grep "@mount" --reporter=line --workers=1
      - name: Extreme pan and viewport persistence
        if: always()
        run: npx playwright test server/matureChartBrowser.spec.js --grep "@pan" --reporter=line --workers=1
      - name: Time zoom and price-axis independence
        if: always()
        run: npx playwright test server/matureChartBrowser.spec.js --grep "@zoom" --reporter=line --workers=1
      - name: Symbol timeframe and fallback truth
        if: always()
        run: npx playwright test server/matureChartBrowser.spec.js --grep "@state" --reporter=line --workers=1
