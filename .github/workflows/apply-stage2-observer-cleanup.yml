name: Apply Stage 2 Observer Cleanup
on:
  push:
    branches: [exchange-cleanup-stage2-observers]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exchange-cleanup-stage2-observers
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact observer replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f'{path}: expected exactly one match, found {s.count(old)} for {old[:80]!r}')
              p.write_text(s.replace(old,new,1))

          # 1) Tier integrity: arbitrary DOM mutation -> explicit Exchange-render boundary.
          replace_once('public/v45-exchange-tier-integrity-v1.js',
            "new MutationObserver(scheduleAudit).observe(document.documentElement,{childList:true,subtree:true,characterData:true});",
            "window.addEventListener('sbc:exchange-rendered',scheduleAudit);")

          # 2) Layout/recent-sales: late arbitrary DOM insertion -> explicit Exchange-render boundary.
          replace_once('public/v45-exchange-layout-sales-v1.js',
            "let mt;new MutationObserver(()=>{clearTimeout(mt);mt=setTimeout(()=>{layout();enforceBadgeScope();},40)}).observe(document.documentElement,{childList:true,subtree:true});",
            "window.addEventListener('sbc:exchange-rendered',()=>{layout();enforceBadgeScope();});")

          # 3) Ticket v36: emit one deterministic render event after backend book paint.
          replace_once('public/v45-ticket-market-v36.js',
            "  return mappedMarket(book,fallback);\n}",
            "  const out=mappedMarket(book,fallback);\n  window.dispatchEvent?.(new CustomEvent('sbc:exchange-rendered',{detail:{source:'ticket-market-v36',ticketType:book?.ticketType||currentType()}}));\n  return out;\n}")
          replace_once('public/v45-ticket-market-v36.js',
            "if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();new MutationObserver(()=>schedule()).observe(document.documentElement,{childList:true,subtree:true});setTimeout(run,400);setTimeout(run,1200);",
            "if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();window.addEventListener('sbc:exchange-rendered',()=>schedule());document.addEventListener('click',e=>{if(e.target?.closest?.('#ticketTypeSelector button'))setTimeout(schedule,0)},true);setTimeout(run,400);setTimeout(run,1200);")

          # 4) Ticket v35 standalone fallback: fetch already schedules book work; explicit render/selector hooks replace global observation.
          replace_once('public/v45-ticket-market-v35.js',
            "if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();new MutationObserver(()=>scheduleRender()).observe(document.documentElement,{childList:true,subtree:true});setTimeout(run,500);setTimeout(run,1600);",
            "if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();window.addEventListener('sbc:exchange-rendered',scheduleRender);document.addEventListener('click',e=>{if(e.target?.closest?.('#ticketTypeSelector button,.hit-ask,.hit-bid'))setTimeout(scheduleRender,0)},true);setTimeout(run,500);setTimeout(run,1600);")

          # 5) My Tickets cleanup: global DOM churn -> explicit Exchange render hook.
          replace_once('public/v45-my-tickets-cleanup-v37.js',
            "let t;new MutationObserver(()=>{clearTimeout(t);t=setTimeout(run,60)}).observe(document.documentElement,{childList:true,subtree:true});",
            "window.addEventListener('sbc:exchange-rendered',run);")

          # 6) Settlement scroll mechanics: book-row mutation -> explicit Exchange render hook.
          replace_once('public/v45-ticket-settlement-v38.js',
            "const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];let timer=null;",
            "const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];")
          replace_once('public/v45-ticket-settlement-v38.js',
            "if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(run,100)}).observe(document.documentElement,{childList:true,subtree:true});setTimeout(run,350);setTimeout(run,1200);",
            "if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();window.addEventListener('sbc:exchange-rendered',run);setTimeout(run,350);setTimeout(run,1200);")

          # 7) Recent trades placement: My Orders DOM mutation -> explicit Exchange render hook. Keep its existing Stage-3 timer untouched.
          replace_once('public/v45-ticket-recent-v40.js',
            "new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});",
            "window.addEventListener('sbc:exchange-rendered',schedule);")

          # 8) Badge Stage 4: selector mutation -> deterministic boot/render signaling.
          replace_once('public/v45-badge-market-stage4.js',
            "async function refresh(){if(!badgeMode)return;try{book=await api('/api/badge-market/book');render()}catch(e){if(badgeMode)alert(e.message)}}",
            "async function refresh(){if(!badgeMode)return;try{book=await api('/api/badge-market/book');render();window.dispatchEvent?.(new CustomEvent('sbc:exchange-rendered',{detail:{source:'badge-market-stage4',market:'badge'}}))}catch(e){if(badgeMode)alert(e.message)}}")
          replace_once('public/v45-badge-market-stage4.js',
            "let moTimer;new MutationObserver(()=>{clearTimeout(moTimer);moTimer=setTimeout(()=>{ensureBadgeSlot();syncModeToActiveTab()},40)}).observe(document.documentElement,{childList:true,subtree:true});",
            "window.addEventListener('sbc:exchange-rendered',()=>{ensureBadgeSlot();syncModeToActiveTab()});")

          targets=[
            'public/v45-exchange-tier-integrity-v1.js','public/v45-exchange-layout-sales-v1.js',
            'public/v45-ticket-market-v36.js','public/v45-ticket-market-v35.js',
            'public/v45-my-tickets-cleanup-v37.js','public/v45-ticket-settlement-v38.js',
            'public/v45-ticket-recent-v40.js','public/v45-badge-market-stage4.js']
          bad=[p for p in targets if 'MutationObserver' in Path(p).read_text()]
          if bad: raise SystemExit('MutationObserver remains in: '+', '.join(bad))
          print('PASS: zero MutationObserver across all 8 Stage-2 targets')
          PY
      - name: Verify closed Stage 2 scope
        run: |
          set -e
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' \
            public/v45-badge-market-stage4.js \
            public/v45-exchange-layout-sales-v1.js \
            public/v45-exchange-tier-integrity-v1.js \
            public/v45-my-tickets-cleanup-v37.js \
            public/v45-ticket-market-v35.js \
            public/v45-ticket-market-v36.js \
            public/v45-ticket-recent-v40.js \
            public/v45-ticket-settlement-v38.js | sort)"
          test "$changed" = "$expected"
          ! grep -n 'MutationObserver' \
            public/v45-badge-market-stage4.js \
            public/v45-exchange-layout-sales-v1.js \
            public/v45-exchange-tier-integrity-v1.js \
            public/v45-my-tickets-cleanup-v37.js \
            public/v45-ticket-market-v35.js \
            public/v45-ticket-market-v36.js \
            public/v45-ticket-recent-v40.js \
            public/v45-ticket-settlement-v38.js
      - name: Commit Stage 2 and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/apply-stage2-observer-cleanup.yml
          git add public/v45-badge-market-stage4.js public/v45-exchange-layout-sales-v1.js public/v45-exchange-tier-integrity-v1.js public/v45-my-tickets-cleanup-v37.js public/v45-ticket-market-v35.js public/v45-ticket-market-v36.js public/v45-ticket-recent-v40.js public/v45-ticket-settlement-v38.js .github/workflows/apply-stage2-observer-cleanup.yml
          git commit -m 'Exchange cleanup Stage 2: replace DOM observers with render hooks'
          git push origin HEAD:exchange-cleanup-stage2-observers
