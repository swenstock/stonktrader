name: Correct Stage 6 Badge Scope Selectors
on:
  push:
    branches: [stage6-badge-scope-symmetry]
permissions:
  contents: write
jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-badge-scope-symmetry
      - name: Prove selectors against exact assembled V45 shell source
        run: |
          node <<'NODE'
          const { exactV45Shell } = require('./server/v45ExactShell');
          const html = exactV45Shell.toString('utf8');
          const needles = [
            'class="market-actions-v22"',
            'class="place-bid-btn"',
            'class="list-ask-btn"',
            'onclick="openMarketBid()"',
            'onclick="openMarketSell()"'
          ];
          console.log('EXACT V45 SHELL SELECTOR PROOF');
          for (const needle of needles) {
            const count = html.split(needle).length - 1;
            console.log(`${needle} => ${count}`);
            if (count < 1) process.exitCode = 1;
          }
          const wrong = ['class="book-actions"','id="placeBid"','id="postOffer"'];
          for (const needle of wrong) {
            const count = html.split(needle).length - 1;
            console.log(`${needle} => ${count}`);
            if (count !== 0) process.exitCode = 1;
          }
          for (const marker of ['market-actions-v22','place-bid-btn','list-ask-btn']) {
            const i = html.indexOf(marker);
            const start = Math.max(0, html.lastIndexOf('<div', i));
            const end = Math.min(html.length, html.indexOf('</div>', i) + 6);
            console.log(`SNIPPET ${marker}:`);
            console.log(html.slice(start, end).replace(/\s+/g,' ').trim());
          }
          if (process.exitCode) process.exit(process.exitCode);
          NODE
      - name: Correct only the two rejected selectors
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='public/v45-exchange-layout-sales-v1.js';
          let s=fs.readFileSync(p,'utf8');
          const replacements=[
            ["document.querySelector('.book-actions')","document.querySelector('.market-actions-v22')"],
            ["e.target?.closest?.('#placeBid,#postOffer')","e.target?.closest?.('.place-bid-btn,.list-ask-btn')"]
          ];
          for(const [from,to] of replacements){
            const count=s.split(from).length-1;
            console.log(`replace ${from} count=${count}`);
            if(count!==1) throw new Error(`expected exactly one rejected selector: ${from}`);
            s=s.replace(from,to);
          }
          fs.writeFileSync(p,s);
          NODE
          node --check public/v45-exchange-layout-sales-v1.js
          grep -F "ticketActions=document.querySelector('.market-actions-v22')" public/v45-exchange-layout-sales-v1.js
          grep -F "ticketAction=e.target?.closest?.('.place-bid-btn,.list-ask-btn')" public/v45-exchange-layout-sales-v1.js
          ! grep -F "document.querySelector('.book-actions')" public/v45-exchange-layout-sales-v1.js
          ! grep -F "e.target?.closest?.('#placeBid,#postOffer')" public/v45-exchange-layout-sales-v1.js
      - name: Commit correction and remove temporary workflow
        run: |
          rm .github/workflows/correct-stage6-badge-scope-selectors.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/v45-exchange-layout-sales-v1.js .github/workflows/correct-stage6-badge-scope-selectors.yml
          git commit -m 'Stage 6: correct Badge scope selectors against real shell'
          git push origin HEAD:stage6-badge-scope-symmetry
