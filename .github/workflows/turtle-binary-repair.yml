name: Turtle binary repair

on:
  push:
    branches: [turtle-art-binary-repair-final]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact approved PNGs when ready
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .repair/READY ]; then
            echo "Repair chunks not complete yet; exiting."
            exit 0
          fi
          mkdir -p server/turtle_art_v1
          for key in freeroll runner clerk trader junior; do
            cat .repair/${key}.part*.b64 | tr -d '\n\r' | base64 --decode > server/turtle_art_v1/${key}.png
          done
          sha256sum -c .repair/SHA256SUMS
          python - <<'PY'
          from PIL import Image
          for k in ['freeroll','runner','clerk','trader','junior']:
              p=f'server/turtle_art_v1/{k}.png'
              im=Image.open(p); im.load()
              assert im.size==(240,241), (k,im.size)
              assert im.mode=='RGB', (k,im.mode)
          print('All five PNGs decode as 240x241 RGB')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/turtle_art_v1/*.png
          git rm -r .repair .github/workflows/turtle-binary-repair.yml
          git commit -m "Repair canonical turtle art binaries"
          git push origin HEAD:turtle-art-binary-repair-final
