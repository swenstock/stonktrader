name: Stage 6 History Stage 3 shell proof
on:
  push:
    branches: [stage6-history-stage3]
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove exact assembled order-book shell
        run: |
          node <<'NODE'
          const { exactV45Shell } = require('./server/v45ExactShell');
          const html = exactV45Shell.toString('utf8');
          const count = s => html.split(s).length - 1;
          for (const s of ['id="bidBook"','id="askBook"','class="market-summary"']) console.log(`${s} => ${count(s)}`);
          const bi=html.indexOf('id="bidBook"');
          const ai=html.indexOf('id="askBook"');
          console.log('BID_SNIPPET='+html.slice(bi-500,bi+700).replace(/\s+/g,' '));
          console.log('ASK_SNIPPET='+html.slice(ai-500,ai+700).replace(/\s+/g,' '));
          if(count('id="bidBook"')!==1||count('id="askBook"')!==1) process.exit(2);
          NODE
