name: My Tickets Single Owner V1

on:
  pull_request:
    paths:
      - 'public/v45-ticket-market-v36.js'
      - 'public/v45-ticket-native-hooks-v41.js'
      - 'server/myTicketsSingleOwnerV1.test.js'
      - '.github/workflows/my-tickets-single-owner-v1.yml'
  workflow_dispatch:

jobs:
  my-tickets-single-owner-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check changed runtime files
        run: |
          node --check public/v45-ticket-market-v36.js
          node --check public/v45-ticket-native-hooks-v41.js
          node --check server/myTicketsSingleOwnerV1.test.js
      - name: Run single-owner overlap regression
        run: node server/myTicketsSingleOwnerV1.test.js
      - name: Run existing ticket exchange acceptance
        run: |
          node server/ticketExchangeStage1.test.js
          node server/ticketExchangeStage2.test.js
          node server/ticketExchangeStage4Ui.test.js
          node server/exchangeArtworkMappingV1.test.js
