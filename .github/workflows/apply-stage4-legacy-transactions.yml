name: Apply Stage 4 Legacy Transaction Cleanup
on:
  push:
    branches: [exchange-cleanup-stage4-legacy-transactions]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exchange-cleanup-stage4-legacy-transactions
      - name: Retire legacy Exchange transaction dialogs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f'{path}: expected exactly one match, found {s.count(old)} for {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          v35='public/v45-ticket-market-v35.js'
          replace_once(v35,
            "async function editOrder(spec){const [side,id,oldRaw]=spec.split(':'),old=Number(oldRaw);const raw=prompt(`New ${side==='bid'?'bid':'ask'} price in STONK:`,String(old));if(raw===null)return;const price=Math.round(Number(String(raw).replace(/,/g,'')));if(!Number.isFinite(price)||price<=0)return alert('Enter a positive STONK price.');if(price===old)return;try{if(side==='bid')await api(`/api/ticket-market/bids/${id}`,{method:'PATCH',body:JSON.stringify({bidPrice:price})});else await api(`/api/ticket-market/offers/${id}`,{method:'PATCH',body:JSON.stringify({askPrice:price})});await afterChange();}catch(e){alert(e.message);}}\nasync function cancelOrder(spec){const [side,id]=spec.split(':');if(!confirm(`Cancel this ${side==='bid'?'bid':'listing'}?`))return;try{await api(side==='bid'?`/api/ticket-market/bids/${id}`:`/api/ticket-market/offers/${id}`,{method:'DELETE'});await afterChange();}catch(e){alert(e.message);}}",
            "function dialog(){return window.SBCExchangeDialogV1}\nasync function editOrder(spec){const [side,id,oldRaw]=spec.split(':'),old=Number(oldRaw),d=dialog();if(!d?.promptPrice)return;const raw=await d.promptPrice(`Change your ${side==='bid'?'bid':'ask'} price.`,old,{title:'CHANGE PRICE',eyebrow:'YOUR ORDER',confirmLabel:'CHANGE PRICE'});if(raw===null||raw===undefined)return;const price=Math.round(Number(String(raw).replace(/,/g,'')));if(!Number.isFinite(price)||price<=0){await d.notice?.('Enter a positive STONK price.',{title:'PRICE REQUIRED',icon:'!'});return}if(price===old)return;try{if(side==='bid')await api(`/api/ticket-market/bids/${id}`,{method:'PATCH',body:JSON.stringify({bidPrice:price})});else await api(`/api/ticket-market/offers/${id}`,{method:'PATCH',body:JSON.stringify({askPrice:price})});await afterChange();await d.notice?.(`Your ${side==='bid'?'bid':'offer'} is now ${price.toLocaleString()} STONK.`,{title:'ORDER UPDATED'});}catch(e){await d.notice?.(e.message,{title:'ORDER NOT UPDATED',icon:'!'})}}\nasync function cancelOrder(spec){const [side,id]=spec.split(':'),d=dialog();if(!d?.confirm)return;const ok=await d.confirm(`Cancel this ${side==='bid'?'bid':'listing'}?`,{title:'CANCEL ORDER',confirmLabel:'CANCEL ORDER',danger:true,icon:'!'});if(!ok)return;try{await api(side==='bid'?`/api/ticket-market/bids/${id}`:`/api/ticket-market/offers/${id}`,{method:'DELETE'});await afterChange();await d.notice?.('Your order has been cancelled.',{title:'ORDER CANCELLED'});}catch(e){await d.notice?.(e.message,{title:'ORDER NOT CANCELLED',icon:'!'})}}")

          badge='public/v45-badge-market-stage4.js'
          replace_once(badge,
            "function confirmPrice(price,action){const w=warningFor(price);if(!w)return true;const direction=w.price<w.ref?'below':'above';return confirm(`PRICE CHECK\\n\\nYou are about to ${action} at ${fmt(w.price)} STONK.\\nCurrent market reference: ${fmt(w.ref)} STONK.\\nThat is ${(w.gap*100).toFixed(1)}% ${direction} the reference and outside the normal ${fmt(w.floor)}–${fmt(w.ceiling)} Badge range.\\n\\nThis may be intentional. Proceed anyway?`)}\n",
            "function unified(){return window.__SBC_BADGE_DIALOG_UNIFIED_V1}\nfunction routeBadge(action,...args){const owner=unified();if(owner?.[action])return owner[action](...args);return window.SBCExchangeDialogV1?.notice?.('Badge transaction dialog is unavailable. Refresh and try again.',{title:'BADGE EXCHANGE',eyebrow:'JR STONK BROKER BADGE',icon:'!'})}\n")
          replace_once(badge,
            "$('#sbcBadgeMint',el).onclick=mint;$('#sbcBadgeList',el).onclick=listBadge;$('#sbcBadgeBid',el).onclick=postBid;",
            "$('#sbcBadgeMint',el).onclick=()=>routeBadge('mint');$('#sbcBadgeList',el).onclick=()=>routeBadge('listBadge');$('#sbcBadgeBid',el).onclick=()=>routeBadge('postBid');")
          replace_once(badge,
            "async function refresh(){if(!badgeMode)return;try{book=await api('/api/badge-market/book');render();window.dispatchEvent?.(new CustomEvent('sbc:exchange-rendered',{detail:{source:'badge-market-stage4',market:'badge'}}))}catch(e){if(badgeMode)alert(e.message)}}\nfunction requireTradeAuth(){if(signedIn())return true;alert('Sign in to trade Jr Stonk Broker Badges.');return false}\nasync function listBadge(){if(!requireTradeAuth())return;const raw=prompt('Ask price for 1 Jr Stonk Broker Badge in STONK:',String(book?.lowestAsk||48000));if(raw===null)return;const price=Math.round(Number(String(raw).replace(/,/g,'')));if(!(price>0))return alert('Enter a positive STONK price.');if(!confirmPrice(price,'list your Badge'))return;try{await api('/api/badge-market/listings',{method:'POST',body:JSON.stringify({askPrice:price})});await refresh()}catch(e){alert(e.message)}}\nasync function postBid(){if(!requireTradeAuth())return;const raw=prompt('Bid price for 1 Jr Stonk Broker Badge in STONK:',String(book?.highestBid||40000));if(raw===null)return;const price=Math.round(Number(String(raw).replace(/,/g,'')));if(!(price>0))return alert('Enter a positive STONK price.');if(!confirmPrice(price,'post this bid'))return;try{await api('/api/badge-market/bids',{method:'POST',body:JSON.stringify({bidPrice:price})});await refresh()}catch(e){alert(e.message)}}\nasync function mint(){if(!requireTradeAuth())return;if(!confirm('Buy 1 Jr Stonk Broker Badge for 48,000 STONK?\\n\\n36,666.6 STONK backs the Broker Reserve and 11,333.4 STONK goes to Overflow.'))return;try{await api('/api/badge-market/mint',{method:'POST',body:'{}'});await refresh()}catch(e){alert(e.message)}}\nasync function buy(id,price){if(!requireTradeAuth())return;if(!confirmPrice(price,'buy this Badge'))return;if(!confirm(`Buy 1 Jr Stonk Broker Badge for ${fmt(price)} STONK?`))return;try{await api(`/api/badge-market/listings/${id}/buy`,{method:'POST',body:'{}'});await refresh()}catch(e){alert(e.message)}}\nasync function sell(id,price){if(!requireTradeAuth())return;if(!confirmPrice(price,'sell your Badge'))return;if(!confirm(`Sell 1 Jr Stonk Broker Badge into this ${fmt(price)} STONK bid?`))return;try{await api(`/api/badge-market/bids/${id}/sell`,{method:'POST',body:'{}'});await refresh()}catch(e){alert(e.message)}}\nasync function cancelListing(id){if(!requireTradeAuth())return;if(!confirm('Cancel this Badge ask and release the reserved Badge?'))return;try{await api(`/api/badge-market/listings/${id}`,{method:'DELETE'});await refresh()}catch(e){alert(e.message)}}\nasync function cancelBid(id){if(!requireTradeAuth())return;if(!confirm('Cancel this Badge bid and release the held STONK?'))return;try{await api(`/api/badge-market/bids/${id}`,{method:'DELETE'});await refresh()}catch(e){alert(e.message)}}",
            "async function refresh(){if(!badgeMode)return;try{book=await api('/api/badge-market/book');render();window.dispatchEvent?.(new CustomEvent('sbc:exchange-rendered',{detail:{source:'badge-market-stage4',market:'badge'}}))}catch(e){if(badgeMode)window.SBCExchangeDialogV1?.notice?.(e.message,{title:'BADGE MARKET NOT REFRESHED',eyebrow:'JR STONK BROKER BADGE',icon:'!'})}}")
          replace_once(badge,
            "document.addEventListener('click',e=>{const t=e.target?.closest?.('[data-badge-buy],[data-badge-sell],[data-badge-cancel-listing],[data-badge-cancel-bid]');if(t){e.preventDefault();e.stopPropagation();if(t.dataset.badgeCancelListing)return cancelListing(Number(t.dataset.badgeCancelListing));if(t.dataset.badgeCancelBid)return cancelBid(Number(t.dataset.badgeCancelBid));const id=Number(t.dataset.badgeBuy||t.dataset.badgeSell),price=Number(t.dataset.price);return t.dataset.badgeBuy?buy(id,price):sell(id,price)}const tab=e.target?.closest?.('#ticketTypeSelector button');if(tab&&tab.id!=='sbcBadgeMarketTab')deactivateBadgeMode()},true);",
            "document.addEventListener('click',e=>{const t=e.target?.closest?.('[data-badge-buy],[data-badge-sell],[data-badge-cancel-listing],[data-badge-cancel-bid]');if(t){e.preventDefault();e.stopPropagation();if(t.dataset.badgeCancelListing)return routeBadge('cancelListing',Number(t.dataset.badgeCancelListing));if(t.dataset.badgeCancelBid)return routeBadge('cancelBid',Number(t.dataset.badgeCancelBid));const id=Number(t.dataset.badgeBuy||t.dataset.badgeSell),price=Number(t.dataset.price);return t.dataset.badgeBuy?routeBadge('buy',id,price):routeBadge('sell',id,price)}const tab=e.target?.closest?.('#ticketTypeSelector button');if(tab&&tab.id!=='sbcBadgeMarketTab')deactivateBadgeMode()},true);")

          # Stage 4 contract: no browser-native transaction dialogs remain in these two legacy owners.
          for name in (v35,badge):
              s=Path(name).read_text()
              forbidden=['prompt(', 'confirm(', 'alert(']
              # Allow object-method .confirm/.promptPrice/.notice; reject only bare browser-native calls.
              for needle in forbidden:
                  import re
                  pat=r'(?<![.A-Za-z0-9_$])'+re.escape(needle)
                  if re.search(pat,s): raise SystemExit(f'{name}: browser-native {needle} remains')
          # The unrelated stock-trade confirmation owner is intentionally unchanged.
          trader=Path('public/v45-trader-action-confirm-v42.js').read_text()
          if '/api/portfolios/' not in trader or '/api/advanced-orders-v15' not in trader:
              raise SystemExit('trader-action-confirm-v42 no longer matches reviewed stock-trade role')
      - name: Syntax checks
        run: |
          node --check public/v45-ticket-market-v35.js
          node --check public/v45-badge-market-stage4.js
          node --check public/v45-trader-action-confirm-v42.js
      - name: Commit Stage 4 and remove temporary workflow
        run: |
          rm .github/workflows/apply-stage4-legacy-transactions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/v45-ticket-market-v35.js public/v45-badge-market-stage4.js .github/workflows/apply-stage4-legacy-transactions.yml
          git commit -m 'Exchange cleanup Stage 4: retire legacy transaction dialogs'
          git push origin HEAD:exchange-cleanup-stage4-legacy-transactions