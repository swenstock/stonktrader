name: Stage 40 Basket Universe
on:
  workflow_dispatch:
jobs:
  basket-universe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check Stage 40 universe
        run: |
          node --check public/v45-basket-loader-v43.js
          node --check server/dataProvider.js
          node --check scripts/validate-stage40-basket-universe.js
      - name: Validate Stage 40 basket universe
        run: node scripts/validate-stage40-basket-universe.js
