name: Normalize Stage 6 Item C Badge SQL
on:
  push:
    branches: [stage6-item-c-api-counterparties]
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-item-c-api-counterparties
      - name: Normalize query formatting
        shell: python
        run: |
          from pathlib import Path
          p=Path('server/badgeMarketV45.js'); s=p.read_text()
          old="SELECT t.*, buyer.display_name buyer_display_name, seller.display_name seller_display_name\\n    FROM badge_trades t\\n    JOIN accounts buyer_account ON buyer_account.id=t.buyer_account_id\\n    JOIN users buyer ON buyer.id=buyer_account.user_id\\n    JOIN accounts seller_account ON seller_account.id=t.seller_account_id\\n    JOIN users seller ON seller.id=seller_account.user_id\\n    ORDER BY t.id DESC LIMIT 20"
          new=old.replace('\\n','\n')
          if s.count(old)!=1: raise SystemExit(f'expected one escaped Badge recent query, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
      - name: Syntax check and commit
        run: |
          node --check server/badgeMarketV45.js
          rm .github/workflows/normalize-stage6-item-c-badge-sql.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/badgeMarketV45.js .github/workflows/normalize-stage6-item-c-badge-sql.yml
          git commit -m 'Normalize Item C Badge recent-trade query formatting'
          git push origin HEAD:stage6-item-c-api-counterparties