name: Fix Mature Chart Mouse Inertia V1
on:
  push:
    branches: [mature-chart-owner-v1]
    paths: ['.github/workflows/fix-mature-chart-kinetic-v1.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mature-chart-owner-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Disable desktop kinetic pan and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/v45-mature-chart-owner-v1.js')
          s=p.read_text()
          old="kineticScroll:{mouse:true,touch:true}"
          new="kineticScroll:{mouse:false,touch:true}"
          if old not in s:
              raise SystemExit('kinetic scroll anchor missing')
          p.write_text(s.replace(old,new,1))
          p=Path('server/matureChartOwnerV1.test.js')
          t=p.read_text()
          anchor="assert(client.includes(\"handleScale:{mouseWheel:true\"),'plot wheel must use native time-scale zoom');"
          extra=anchor+"\nassert(client.includes(\"kineticScroll:{mouse:false,touch:true}\"),'desktop mouse pan must stop exactly on release with no inertial drift');"
          if anchor not in t:
              raise SystemExit('test anchor missing')
          p.write_text(t.replace(anchor,extra,1))
          PY
          npm ci
          node server/matureChartOwnerV1.test.js
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-mature-chart-kinetic-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/v45-mature-chart-owner-v1.js server/matureChartOwnerV1.test.js .github/workflows/fix-mature-chart-kinetic-v1.yml
          git commit -m 'Stop desktop chart pan exactly on release'
          git push origin HEAD:mature-chart-owner-v1
