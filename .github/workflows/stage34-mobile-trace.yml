name: Stage 34 Mobile Trace
on:
  pull_request:
    branches: [main]
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm ci
      - name: Trace exact V45 mobile shell structure
        run: node scripts/trace-mobile-shell.js
