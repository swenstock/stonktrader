name: Desktop Workstation Native Layout V1

on:
  pull_request:
    paths:
      - 'public/v45-trading-workstation-v1.js'
      - 'server/desktopWorkstationNativeLayoutV1.test.js'
      - '.github/workflows/desktop-workstation-native-layout-v1.yml'
  workflow_dispatch:

jobs:
  desktop-workstation-native-layout-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Syntax check desktop native layout restoration
        run: |
          node --check public/v45-trading-workstation-v1.js
          node --check server/desktopWorkstationNativeLayoutV1.test.js
      - name: Behavioral desktop native layout regression
        run: node server/desktopWorkstationNativeLayoutV1.test.js
      - name: Existing workstation acceptance
        run: node server/tradingWorkstationV1.test.js
      - name: Existing scroll-reset regression
        run: node server/portfolioScrollResetV1.test.js
