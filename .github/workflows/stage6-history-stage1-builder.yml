name: Stage 6 History Stage 1 builder

on:
  push:
    branches: [stage6-history-stage1]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-history-stage1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire endpoint and regression into app
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('server/index.js')
          s=p.read_text()
          old="const badgeMarketV45Routes = require(\"./routes/badgeMarketV45\");"
          new=old+"\nconst exchangeHistoryV1Routes = require(\"./routes/exchangeHistoryV1\");"
          assert s.count(old)==1
          s=s.replace(old,new)
          old2='app.use("/api/badge-market", badgeMarketV45Routes);'
          new2=old2+'\napp.use("/api/exchange-history", exchangeHistoryV1Routes);'
          assert s.count(old2)==1
          s=s.replace(old2,new2)
          p.write_text(s)

          p=Path('package.json')
          s=p.read_text()
          needle='npm run test:exchange-artwork-mapping-v1 && npm run test:badge-quantity-lock'
          assert s.count(needle)==1
          s=s.replace(needle,'npm run test:exchange-artwork-mapping-v1 && npm run test:exchange-history-v1 && npm run test:badge-quantity-lock')
          needle2='    "test:exchange-artwork-mapping-v1": "node server/exchangeArtworkMappingV1.test.js",\n'
          assert s.count(needle2)==1
          s=s.replace(needle2,needle2+'    "test:exchange-history-v1": "node server/exchangeHistoryV1.test.js",\n')
          p.write_text(s)
          PY
      - name: Run focused proof
        run: node server/exchangeHistoryV1.test.js
      - name: Syntax check
        run: |
          node --check server/exchangeHistoryV1.js
          node --check server/routes/exchangeHistoryV1.js
          node --check server/exchangeHistoryV1.test.js
          node --check server/index.js
      - name: Commit source only and remove builder
        run: |
          rm .github/workflows/stage6-history-stage1-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js package.json server/exchangeHistoryV1.js server/routes/exchangeHistoryV1.js server/exchangeHistoryV1.test.js .github/workflows/stage6-history-stage1-builder.yml
          git commit -m "Add unified paginated Exchange history endpoint"
          git push origin HEAD:stage6-history-stage1
