          P2P: A listed 1 Badge, B bid 40,000; A received 38,000, 2,000 fee; B owns Badge; Broker/Overflow unchanged
          Stage 3 integration: quantity_listed 0 -> 1 on listing; collision sale -> 0; cancel releases directly
          Capacity: 14/14 listings succeed; 15th rejected unchanged
          Mint: 48,000 -> 36,666.6 Broker + 11,333.4 Overflow; buyer balance debited exactly 48,000
          Warning: symmetric >25% + outside band only; in-band thin-market, just-inside threshold, and first-ever listing do not warn
