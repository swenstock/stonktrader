name: Stage 52 Desktop Focus Cleanup
on:
  pull_request:
    paths:
      - 'public/v45-desktop-stage52-v56.js'
      - 'public/v45-desktop-stage52-v56.css'
      - 'public/v45-desktop-stage46-v51-pre.js'
      - 'scripts/validate-stage52-desktop-focus.js'
      - '.github/workflows/stage52-desktop-focus.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-stage52-desktop-focus.js
