name: Stage 6 Badge JSON boundary builder

on:
  push:
    branches: [stage6-badge-json-boundary]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-badge-json-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply JSON-safe Badge reservation response fix
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'server/badgeMarketV45.js';
          let src = fs.readFileSync(path, 'utf8');
          const anchor = "function addBadgeInTransaction(db, accountId) {";
          if ((src.split(anchor).length - 1) !== 1) throw new Error('getHolding insertion anchor mismatch');
          const helper = `function holdingForJson(holding) {\n  return { quantity:Number(holding.quantity), quantity_listed:Number(holding.quantity_listed) };\n}\n`;
          src = src.replace(anchor, helper + anchor);
          const beforeListing = "return { id, askPrice:price, reservation:getHolding(db, accountId), warning:mispricingWarning(price, currentReferencePriceExcluding(db, id)) };";
          const afterListing = "return { id, askPrice:price, reservation:holdingForJson(getHolding(db, accountId)), warning:mispricingWarning(price, currentReferencePriceExcluding(db, id)) };";
          const beforeCancel = "return { ok:true, reservation:getHolding(db, accountId) };";
          const afterCancel = "return { ok:true, reservation:holdingForJson(getHolding(db, accountId)) };";
          if ((src.split(beforeListing).length - 1) !== 1) throw new Error('createListing baseline mismatch');
          if ((src.split(beforeCancel).length - 1) !== 1) throw new Error('cancelListing baseline mismatch');
          src = src.replace(beforeListing, afterListing).replace(beforeCancel, afterCancel);
          fs.writeFileSync(path, src);
          NODE

          cat > server/badgeMarketJsonBoundaryV1.test.js <<'EOF'
          'use strict';

          const assert = require('assert');
          const { DatabaseSync } = require('node:sqlite');
          const market = require('./badgeMarketV45');

          function makeDb() {
            const db = new DatabaseSync(':memory:');
            db.exec('PRAGMA foreign_keys = ON;');
            db.exec(`
              CREATE TABLE users (id INTEGER PRIMARY KEY AUTOINCREMENT, display_name TEXT);
              CREATE TABLE accounts (id INTEGER PRIMARY KEY AUTOINCREMENT, user_id INTEGER REFERENCES users(id));
            `);
            market.ensureSchema(db);
            db.prepare("INSERT INTO users(display_name) VALUES ('badge-json-boundary')").run();
            const accountId = Number(db.prepare('INSERT INTO accounts(user_id) VALUES (1)').run().lastInsertRowid);
            db.prepare(`INSERT INTO sbc_prize_holdings(account_id,asset_type,quantity,quantity_listed) VALUES (?,?,1,0)`)
              .run(accountId, market.BADGE_ASSET_TYPE);
            return { db, accountId };
          }

          (() => {
            const { db, accountId } = makeDb();
            const listing = market.createListing(db, { accountId, askPrice:48000 });
            assert.strictEqual(Number(db.prepare("SELECT COUNT(*) n FROM badge_listings WHERE seller_account_id=? AND status='active'").get(accountId).n), 1);
            assert.deepStrictEqual(listing.reservation, { quantity:1, quantity_listed:1 });
            assert.doesNotThrow(() => JSON.stringify({ ok:true, ...listing }));
            assert.strictEqual(listing.warning.warn, false);
            assert.strictEqual(listing.warning.reason, 'no_reference');

            const cancelled = market.cancelListing(db, { accountId, listingId:listing.id });
            assert.deepStrictEqual(cancelled.reservation, { quantity:1, quantity_listed:0 });
            assert.doesNotThrow(() => JSON.stringify(cancelled));
            assert.strictEqual(db.prepare('SELECT status FROM badge_listings WHERE id=?').get(listing.id).status, 'cancelled');

            const fakeCustodian = { getBalance:() => 1000000, debit:() => {} };
            const bid = market.createBid(db, fakeCustodian, { accountId, bidPrice:47000 });
            assert.doesNotThrow(() => JSON.stringify({ ok:true, ...bid }));
            assert.strictEqual(Number(db.prepare("SELECT COUNT(*) n FROM badge_bids WHERE buyer_account_id=? AND status='active'").get(accountId).n), 1);
            db.close();
            console.log('Badge Market JSON Boundary V1: PASS');
            console.log('Listing/cancel reservation responses are JSON-safe; listing persists exactly once; no-reference warning remains non-throwing; bid response remains JSON-safe.');
          })();
          EOF

          node --check server/badgeMarketV45.js
          node --check server/badgeMarketJsonBoundaryV1.test.js
          node server/badgeMarketJsonBoundaryV1.test.js
      - name: Wire regression into Badge test suite
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const expected = 'node server/badgeQuantityLockV45.test.js';
          if (pkg.scripts['test:badge-quantity-lock'] !== expected) throw new Error('badge test script baseline mismatch');
          pkg.scripts['test:badge-quantity-lock'] = expected + ' && node server/badgeMarketJsonBoundaryV1.test.js';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm run test:badge-quantity-lock
      - name: Commit source-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage6-badge-json-proof.yml
          git add server/badgeMarketV45.js server/badgeMarketJsonBoundaryV1.test.js package.json
          git commit -m "Stage 6: make Badge listing responses JSON-safe"
          git push origin HEAD:stage6-badge-json-boundary
