name: Temporary Exact Chart Fix Transfer

on:
  push:
    branches: [feature-chart-fix-resend]

permissions:
  contents: write

jobs:
  reconstruct-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-chart-fix-resend
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Reconstruct exact verified payload
        run: |
          cat .tmp-chart-fix/payload.part1 .tmp-chart-fix/payload.part2 .tmp-chart-fix/payload.part3a .tmp-chart-fix/payload.part3b > /tmp/chart-fix.b64
          base64 -d /tmp/chart-fix.b64 > /tmp/chart-fix.tgz
          echo '3399106884ca5355b15e726371727eb756f347c984c31d4251fcad0878c47987  /tmp/chart-fix.tgz' | sha256sum -c -
          tar -xzf /tmp/chart-fix.tgz
      - name: Verify exact Git blob identities
        run: |
          test "$(git hash-object public/v45-advanced-chart-v1.js)" = "b80cf40483ecc16f954adef3a0a9f40adb5b9bf3"
          test "$(git hash-object public/v45-advanced-chart-indicators-v1.js)" = "81f34f993a9aad5e3d4969f39d3ddb8feaefc16b"
          test "$(git hash-object public/v45-advanced-chart-visual-pass-v1.js)" = "63160bd5dcf7aab9edaf38f5c2d6eaed8390e68a"
      - name: Run complete chart regression suite
        run: |
          node server/advancedChartStage2.test.js
          node server/advancedChartStage3.test.js
          node server/advancedChartStage4.test.js
          node server/advancedChartStage4Drawing.test.js
          node server/advancedChartStage5.test.js
          node server/advancedChartStage6.test.js
          node server/advancedChartStage6Overlays.test.js
          node server/advancedChartStage103AxisLock.test.js
      - name: Commit exact verified files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/v45-advanced-chart-v1.js public/v45-advanced-chart-indicators-v1.js public/v45-advanced-chart-visual-pass-v1.js
          git diff --cached --quiet && exit 0
          git commit -m 'Apply exact verified Claude chart fix resend'
          git push origin HEAD:feature-chart-fix-resend
