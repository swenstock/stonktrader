name: Browser History Guard
on:
  pull_request:
    paths:
      - 'public/v45-browser-history-v1.js'
      - 'public/v45-desktop-stage46-v51-pre.js'
      - 'scripts/validate-browser-history-v1.js'
      - '.github/workflows/browser-history-v1.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-browser-history-v1.js
