name: Apply Sell All Active Portfolio Fix
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'sell-all-active-portfolio-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sell-all-active-portfolio-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact Stage B Sell All repair
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('public/v45-workspace-portfolio-v1.js')
          s=p.read_text()
          s=s.replace("async function api(path){let t=await requireToken();let r=await fetch(`/api${path}`,{headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},cache:'no-store'});if(r.status===401){clearToken();t=await requireToken();r=await fetch(`/api${path}`,{headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},cache:'no-store'});}const out=await r.json().catch(()=>({}));if(!r.ok)throw new Error(out.error||`Request failed (${r.status})`);return out;}","async function api(path,opts={}){let t=await requireToken();const request=tokenValue=>({...opts,headers:{'Content-Type':'application/json',Authorization:`Bearer ${tokenValue}`,...(opts.headers||{})},cache:'no-store'});let r=await fetch(`/api${path}`,request(t));if(r.status===401){clearToken();t=await requireToken();r=await fetch(`/api${path}`,request(t));}const out=await r.json().catch(()=>({}));if(!r.ok)throw new Error(out.error||`Request failed (${r.status})`);return out;}")
          s=s.replace("async function portfolioSnapshot(options={}){const id=await resolvePortfolioId(options);if(!id)throw new Error('This portfolio could not be identified from the active contest entry.');const p=await api(`/portfolios/${id}`);if(numeric(p?.id)!==id)throw new Error('Portfolio identity changed while loading the active contest entry.');return p;}","async function portfolioSnapshotById(id){id=numeric(id);if(!id)throw new Error('A real backend portfolio ID is required.');const p=await api(`/portfolios/${id}`);if(numeric(p?.id)!==id)throw new Error('Portfolio identity changed while loading the active contest entry.');return p;}\nasync function submitTradeById(id,body){id=numeric(id);if(!id)throw new Error('A real backend portfolio ID is required.');return api(`/portfolios/${id}/trades`,{method:'POST',body:JSON.stringify(body||{})});}\nasync function portfolioSnapshot(options={}){const active=numeric(window.activePortfolioId);if(active&&!options.forceResolve)return portfolioSnapshotById(active);const id=await resolvePortfolioId(options);if(!id)throw new Error('This portfolio could not be identified from the active contest entry.');return portfolioSnapshotById(id);}")
          s=s.replace("window.SBCWorkspacePortfolioV1=Object.freeze({resolvePortfolioId,portfolioSnapshot,ownedPortfolios,directCandidate,categoryFor,priceLevelFor,rankCandidates,authenticate,token,tokenPayload,clearToken,requireToken,validateStoredToken});","window.SBCWorkspacePortfolioV1=Object.freeze({resolvePortfolioId,portfolioSnapshot,portfolioSnapshotById,submitTradeById,ownedPortfolios,directCandidate,categoryFor,priceLevelFor,rankCandidates,authenticate,token,tokenPayload,clearToken,requireToken,validateStoredToken});")
          p.write_text(s)

          p=Path('public/v45-desktop-trading-v45.js')
          s=p.read_text()
          old="async function realSellAllSnapshot(){const orders=window.SBCAdvancedOrdersV15,workspace=window.SBCWorkspacePortfolioV1;if(!orders?.submitOrder)throw new Error('Real order service is unavailable. Refresh the page and try again.');if(!workspace?.portfolioSnapshot)throw new Error('Workspace portfolio service is unavailable. Refresh the page and try again.');return workspace.portfolioSnapshot();}\nfunction sellAllPositions(snapshot){return (Array.isArray(snapshot?.positions)?snapshot.positions:[]).filter(x=>Number(x?.quantity||0)>0&&String(x?.symbol||'').trim());}\nasync function submitSellAllOrdersV46(api,snapshot){const positions=sellAllPositions(snapshot),accepted=[],failed=[];for(const pos of positions){const body={portfolioId:Number(snapshot.id),symbol:String(pos.symbol).toUpperCase(),side:'sell',orderType:'market',quantity:Number(pos.quantity)};try{const out=await api.submitOrder(body);accepted.push({body,out});}catch(error){failed.push({body,error});}}return{positions,accepted,failed};}"
          new="function activeRealPortfolioId(){const c=typeof activePortfolioContext!=='undefined'?activePortfolioContext:null;const id=Number(window.activePortfolioId||c?.portfolioId||c?.portfolio_id||0);return Number.isInteger(id)&&id>0?id:null;}\nasync function realSellAllSnapshot(){const workspace=window.SBCWorkspacePortfolioV1,id=activeRealPortfolioId();if(!id)throw new Error('The active real portfolio ID is missing. Reopen this contest from My Contests.');if(!workspace?.portfolioSnapshotById)throw new Error('Workspace portfolio service is unavailable. Refresh the page and try again.');return workspace.portfolioSnapshotById(id);}\nfunction sellAllPositions(snapshot){return (Array.isArray(snapshot?.positions)?snapshot.positions:[]).filter(x=>Number(x?.quantity||0)>0&&String(x?.symbol||'').trim());}\nasync function submitSellAllOrdersV46(workspace,snapshot){const positions=sellAllPositions(snapshot),accepted=[],failed=[];for(const pos of positions){const body={symbol:String(pos.symbol).toUpperCase(),side:'sell',quantity:Number(pos.quantity)};try{const out=await workspace.submitTradeById(Number(snapshot.id),body);accepted.push({portfolioId:Number(snapshot.id),body,out});}catch(error){failed.push({portfolioId:Number(snapshot.id),body,error});}}return{positions,accepted,failed};}"
          if old not in s: raise SystemExit('Sell All core anchor not found')
          s=s.replace(old,new)
          old2="async function executeSellAll(){const btn=$('[data-sell-all-confirm-v46]'),root=document.getElementById('sellAllConfirmV46');if(btn){btn.disabled=true;btn.textContent='SUBMITTING…';}try{const api=window.SBCAdvancedOrdersV15,snapshot=root?.__sellAllSnapshot||await realSellAllSnapshot(),result=await submitSellAllOrdersV46(api,snapshot);if(!result.positions.length)throw new Error('No real open positions remain.');if(!result.accepted.length){const msg=result.failed[0]?.error?.message||'No market sell orders were accepted.';throw new Error(msg);}await api.refresh?.(true);api.renderBlotter?.();closeSellAll();if(result.failed.length){showConfirm('SELL ALL PARTIAL',`${result.accepted.length} OF ${result.positions.length} ORDERS ACCEPTED`,`${result.failed.length} ORDER${result.failed.length===1?'':'S'} FAILED`,'Review the real blotter before retrying failed positions.','!');}else{showConfirm('SELL ALL ACCEPTED',`${result.accepted.length} MARKET SELL ORDER${result.accepted.length===1?'':'S'} ACCEPTED`,'BACKEND CONFIRMED','Orders will execute now or at the next eligible opening window. Review Queue / Recent / Fills for status.','📉');}}catch(e){if(btn){btn.disabled=false;btn.textContent='CONFIRM SELL ALL';}showConfirm('SELL ALL FAILED','NO SUCCESS WAS ASSUMED',e.message||String(e),'Review the real blotter before trying again.','!');}}"
          new2="async function executeSellAll(){const btn=$('[data-sell-all-confirm-v46]'),root=document.getElementById('sellAllConfirmV46');if(btn){btn.disabled=true;btn.textContent='SUBMITTING…';}try{const workspace=window.SBCWorkspacePortfolioV1,orders=window.SBCAdvancedOrdersV15,snapshot=root?.__sellAllSnapshot||await realSellAllSnapshot(),result=await submitSellAllOrdersV46(workspace,snapshot);if(!result.positions.length)throw new Error('No real open positions remain.');if(!result.accepted.length){const msg=result.failed[0]?.error?.message||'No market sell orders were accepted.';throw new Error(msg);}const refreshed=await workspace.portfolioSnapshotById(Number(snapshot.id));await orders?.refresh?.(true);orders?.renderBlotter?.();closeSellAll();const remaining=sellAllPositions(refreshed);if(result.failed.length||remaining.length){showConfirm('SELL ALL PARTIAL',`${result.accepted.length} OF ${result.positions.length} ORDERS ACCEPTED`,remaining.length?`${remaining.length} POSITION${remaining.length===1?'':'S'} STILL OPEN`:`${result.failed.length} ORDER${result.failed.length===1?'':'S'} FAILED`,'Backend portfolio was refreshed. Review remaining real positions before retrying.','!');}else{showConfirm('SELL ALL COMPLETE',`${result.accepted.length} POSITION${result.accepted.length===1?'':'S'} SOLD`,'BACKEND PORTFOLIO REFRESHED','No positive holdings remain in this real portfolio.','📉');}}catch(e){if(btn){btn.disabled=false;btn.textContent='CONFIRM SELL ALL';}showConfirm('SELL ALL FAILED','NO SUCCESS WAS ASSUMED',e.message||String(e),'Review the real portfolio before trying again.','!');}}"
          if old2 not in s: raise SystemExit('Sell All execute anchor not found')
          s=s.replace(old2,new2)
          p.write_text(s)

          p=Path('scripts/validate-stage41-desktop-refine.js')
          s=p.read_text()
          s=s.replace("const advanced=fs.readFileSync(path.join(root,'public','v45-advanced-orders-v15.js'),'utf8');\n","const advanced=fs.readFileSync(path.join(root,'public','v45-advanced-orders-v15.js'),'utf8');\nconst workspace=fs.readFileSync(path.join(root,'public','v45-workspace-portfolio-v1.js'),'utf8');\n")
          s=s.replace("must(ui.includes('realSellAllSnapshot')&&ui.includes('sellAllPositions(snapshot)')&&ui.includes('submitSellAllOrdersV46'),'Sell All derives work from the authenticated real portfolio snapshot');","must(ui.includes('activeRealPortfolioId')&&ui.includes('portfolioSnapshotById')&&ui.includes('sellAllPositions(snapshot)')&&ui.includes('submitSellAllOrdersV46'),'Sell All derives work from the exact active real portfolio snapshot');")
          s=s.replace("must(ui.includes(\"orderType:'market'\")&&ui.includes(\"side:'sell'\")&&ui.includes('portfolioId:Number(snapshot.id)')&&advanced.includes(\"api('/advanced-orders-v15'\"),'Sell All submits one real backend market sell per actual held position');","must(ui.includes(\"side:'sell'\")&&ui.includes('submitTradeById(Number(snapshot.id),body)')&&workspace.includes(\"api(`/portfolios/${id}/trades`\"),'Sell All submits one real backend market sell per actual held position on the exact active portfolio');")
          p.write_text(s)
          PY

          cat > server/workspacePortfolioStageB.test.js <<'EOF'
          const assert=require('assert');
          const fs=require('fs');
          const vm=require('vm');
          const path=require('path');
          const workspaceSrc=fs.readFileSync(path.join(__dirname,'../public/v45-workspace-portfolio-v1.js'),'utf8');
          const desktopSrc=fs.readFileSync(path.join(__dirname,'../public/v45-desktop-trading-v45.js'),'utf8');
          function between(start,next){const a=desktopSrc.indexOf(start),b=desktopSrc.indexOf(next,a);assert(a>=0&&b>a,`production function not found: ${start}`);return desktopSrc.slice(a,b);}
          const sellSrc=[between('function activeRealPortfolioId()','async function realSellAllSnapshot'),between('async function realSellAllSnapshot()','function sellAllPositions'),between('function sellAllPositions','async function submitSellAllOrdersV46'),between('async function submitSellAllOrdersV46','async function openSellAll')].join('\n');
          (async()=>{
            const store=new Map([['token','stage.b.token']]),calls=[];
            const state={id:77,label:'Degen Hours — Free (Entry 1)',cash:70000,context:{type:'satellite',tierId:'hourly',priceLevel:'free',status:'open',startsAt:'2026-08-27T14:30:00Z'},positions:[{symbol:'BA',quantity:56.23},{symbol:'COIN',quantity:35.1},{symbol:'VZ',quantity:0}]};
            const localStorage={get length(){return store.size},getItem:k=>store.get(k)||null,key:i=>[...store.keys()][i]||null,setItem:(k,v)=>store.set(k,String(v)),removeItem:k=>store.delete(k)};
            function ok(body){return{ok:true,status:200,json:async()=>body}} function fail(status,body){return{ok:false,status,json:async()=>body}}
            const fetch=async(url,opts={})=>{calls.push({url,method:opts.method||'GET',body:opts.body||null});assert.strictEqual(opts.headers?.Authorization,'Bearer stage.b.token');if(url==='/api/portfolios/77'&&(opts.method||'GET')==='GET')return ok(JSON.parse(JSON.stringify(state)));if(url==='/api/portfolios/77/trades'&&opts.method==='POST'){const body=JSON.parse(opts.body||'{}');assert.strictEqual(body.side,'sell');const pos=state.positions.find(p=>p.symbol===body.symbol);assert(pos&&pos.quantity>0);assert.strictEqual(Number(body.quantity),Number(pos.quantity));pos.quantity=0;return ok({ok:true,symbol:body.symbol,side:'sell',quantity:body.quantity,price:100});}if(url==='/api/portfolios')throw new Error('Sell All must not re-resolve through owned portfolio list once a real portfolio is open.');return fail(404,{error:'unexpected '+url});};
            const sandbox={window:{activePortfolioId:77},localStorage,fetch,console,setTimeout,clearTimeout,RegExp,Date,Number,String,Object,Array,Map,Set,Promise,activePortfolioContext:{portfolioId:88,portfolio_id:88,session:'DEGEN HOURS',tier:'free',mode:'live',entry:1},currentPortfolio:()=>({id:99,portfolioId:99,holdings:{FAKE:{shares:999}}})};sandbox.window.window=sandbox.window;vm.createContext(sandbox);vm.runInContext(workspaceSrc,sandbox);vm.runInContext(`${sellSrc}\nwindow.__stageB={activeRealPortfolioId,realSellAllSnapshot,sellAllPositions,submitSellAllOrdersV46};`,sandbox);const sell=sandbox.window.__stageB,workspace=sandbox.window.SBCWorkspacePortfolioV1;
            assert.strictEqual(sell.activeRealPortfolioId(),77);const loaded=await sell.realSellAllSnapshot();assert.strictEqual(loaded.id,77);assert.deepStrictEqual(calls.map(x=>`${x.method} ${x.url}`),['GET /api/portfolios/77']);assert.strictEqual(sell.sellAllPositions(loaded).length,2);
            const result=await sell.submitSellAllOrdersV46(workspace,loaded);assert.strictEqual(result.accepted.length,2);assert.strictEqual(result.failed.length,0);assert.deepStrictEqual(calls.slice(1,3).map(x=>({method:x.method,url:x.url,body:JSON.parse(x.body)})),[{method:'POST',url:'/api/portfolios/77/trades',body:{symbol:'BA',side:'sell',quantity:56.23}},{method:'POST',url:'/api/portfolios/77/trades',body:{symbol:'COIN',side:'sell',quantity:35.1}}]);
            const refreshed=await workspace.portfolioSnapshotById(77);assert.strictEqual(sell.sellAllPositions(refreshed).length,0);assert.deepStrictEqual(calls.map(x=>`${x.method} ${x.url}`),['GET /api/portfolios/77','POST /api/portfolios/77/trades','POST /api/portfolios/77/trades','GET /api/portfolios/77']);console.log('Workspace Consolidation Stage B — Sell All: PASS');console.log('Active real portfolio 77 -> direct GET -> BA/COIN real sell POSTs -> direct GET 77 -> zero positive holdings.');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF

          python <<'PY'
          from pathlib import Path
          p=Path('server/ordersActivityPanelFixes.test.js')
          s=p.read_text()
          s=s.replace("const m=desk.match(/function sellAllPositions\\(snapshot\\)\\{.*?\\}\\nasync function submitSellAllOrdersV46\\(api,snapshot\\)\\{.*?\\}\\nasync function openSellAll/s);","const m=desk.match(/function sellAllPositions\\(snapshot\\)\\{.*?\\}\\nasync function submitSellAllOrdersV46\\(workspace,snapshot\\)\\{.*?\\}\\nasync function openSellAll/s);")
          s=s.replace("const calls=[];const api={submitOrder:async body=>{calls.push(body);return {ok:true,queued:true,id:calls.length};}};","const calls=[];const api={submitTradeById:async(id,body)=>{calls.push({id,body});return {ok:true};}};")
          s=s.replace("assert.deepStrictEqual(JSON.parse(JSON.stringify(calls)),[{portfolioId:77,symbol:'AMZN',side:'sell',orderType:'market',quantity:3.5},{portfolioId:77,symbol:'META',side:'sell',orderType:'market',quantity:2}]);","assert.deepStrictEqual(JSON.parse(JSON.stringify(calls)),[{id:77,body:{symbol:'AMZN',side:'sell',quantity:3.5}},{id:77,body:{symbol:'META',side:'sell',quantity:2}}]);")
          s=s.replace("const partialApi={submitOrder:async body=>{partialCalls.push(body);if(body.symbol==='META')throw new Error('reject');return {ok:true};}};","const partialApi={submitTradeById:async(id,body)=>{partialCalls.push({id,body});if(body.symbol==='META')throw new Error('reject');return {ok:true};}};")
          s=s.replace("Sell All used real snapshot portfolio 77 and submitted one real market sell per actual holding; partial failures remain explicit.","Sell All used exact snapshot portfolio 77 and submitted one real trade-route market sell per actual holding; partial failures remain explicit.")
          p.write_text(s)
          PY

          node --check public/v45-workspace-portfolio-v1.js
          node --check public/v45-desktop-trading-v45.js
          node server/workspacePortfolioStageB.test.js
          node server/ordersActivityPanelFixes.test.js
          node scripts/validate-stage41-desktop-refine.js
          rm .github/workflows/apply-sell-all-fix.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Fix Sell All against exact active backend portfolio"
          git push origin HEAD:sell-all-active-portfolio-v1
