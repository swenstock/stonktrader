name: Apply Stage 6 Item A
on:
  push:
    branches: [stage6-item-a-investigate]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-item-a-investigate
      - name: Replace prototype BUY OFFER path with real backend purchase
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing exact target in {path}: {old[:160]}')
              if s.count(old)!=1:
                  raise SystemExit(f'expected one target in {path}, found {s.count(old)}')
              p.write_text(s.replace(old,new,1))

          path='public/v45-ticket-market-v36.js'
          old="if(askBook)askBook.innerHTML=offers.map(o=>`<div class=\"book-row\"><div class=\"book-ticket-meta\">${visual()}<div><strong>1 ${name} Ticket Offered</strong><small>Seller #${String(o.id).slice(-4)} • Offer listed for sale</small></div></div><div class=\"book-price ask\">${priceOf(o).toLocaleString()} STONK</div><button class=\"hit-ask\" onclick=\"buyAtAsk(${priceOf(o)})\">BUY OFFER</button></div>`).join('');"
          new="if(askBook)askBook.innerHTML=offers.map(o=>`<div class=\"book-row\"><div class=\"book-ticket-meta\">${visual()}<div><strong>1 ${name} Ticket Offered</strong><small>Seller #${String(o.id).slice(-4)} • Offer listed for sale</small></div></div><div class=\"book-price ask\">${priceOf(o).toLocaleString()} STONK</div><button class=\"hit-ask\" data-sbc-offer-id=\"${o.id}\" data-sbc-offer-price=\"${priceOf(o)}\">BUY OFFER</button></div>`).join('');"
          replace(path,old,new)

          anchor="window.hitBestBid=function(){return realHitBestBid().catch(err=>alert(err.message))};"
          insert=anchor+"\nasync function buyRealOffer(offerId,price,type=currentType()){const id=Number(offerId),p=Math.round(Number(price));if(!(id>0)||!(p>0))throw new Error('That offer is no longer available. Refresh the ticket market and try again.');const d=window.SBCExchangeDialogV1;if(!d?.confirm)throw new Error('Exchange confirmation dialog is unavailable.');const label=TYPE_LABELS[type]||type,ok=await d.confirm(`Buy 1 ${label} Ticket for ${p.toLocaleString()} STONK?`,{title:`BUY ${String(label).toUpperCase()} TICKET`,eyebrow:'TICKET EXCHANGE',confirmLabel:`BUY FOR ${p.toLocaleString()} STONK`,cancelLabel:'CLOSE',icon:'?'});if(!ok)return null;try{const result=await api(`/api/ticket-market/offers/${id}/buy`,{method:'POST'});await window.__SBC_TICKET_REAL_OFFER_TEST?.refreshSelectorInventory?.();await window.renderTicketMarket?.();window.dispatchEvent?.(new CustomEvent('sbc:exchange-heartbeat',{detail:{source:'ticket-buy-fill',ticketType:result?.ticketType||type,offerId:id}}));await d.notice?.(`You bought 1 ${label} Ticket for ${Number(result?.paid??p).toLocaleString()} STONK.`,{title:'PURCHASE COMPLETE',eyebrow:'TICKET EXCHANGE',icon:'✓'});return result}catch(e){await d.notice?.(e.message,{title:'PURCHASE NOT COMPLETED',eyebrow:'TICKET EXCHANGE',icon:'!'});return null}}\nfunction interceptRealAsk(e){const btn=e.target?.closest?.('.hit-ask[data-sbc-offer-id]');if(!btn||!btn.closest?.('#view-exchange'))return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.();if(btn.disabled)return;btn.disabled=true;buyRealOffer(btn.dataset.sbcOfferId,btn.dataset.sbcOfferPrice,currentType()).finally(()=>{if(btn.isConnected)btn.disabled=false;});}\ndocument.addEventListener('click',interceptRealAsk,true);"
          replace(path,anchor,insert)

          vp='scripts/validate-stage26-my-tickets.js'
          p=Path(vp); s=p.read_text()
          anchor="must(routing.includes('function livePrices(book)')&&routing.includes('book?.bids||[]')&&routing.includes('book?.offers||[]')&&routing.includes('function paintSellModal')&&routing.includes('SELL NOW'),'sell confirmation paints executable highest bid, lowest ask, and SELL NOW from the exact live tier book');"
          new=anchor+"\nmust(ticketMarketUi.includes('data-sbc-offer-id')&&ticketMarketUi.includes('function buyRealOffer(')&&ticketMarketUi.includes('/api/ticket-market/offers/${id}/buy')&&ticketMarketUi.includes('SBCExchangeDialogV1')&&ticketMarketUi.includes('sbc:exchange-heartbeat')&&!ticketMarketUi.includes('onclick=\\\"buyAtAsk(${priceOf(o)})\\\"'),'BUY OFFER bypasses the prototype shell dialog, executes the real backend offer by id, and reconciles through the existing Exchange heartbeat');"
          if "const ticketMarketUi=" not in s:
              source_anchor="const ui=fs.readFileSync(path.join(__dirname,'..','public','v45-my-tickets-cleanup-v37.js'),'utf8');"
              source_new=source_anchor+"\nconst ticketMarketUi=fs.readFileSync(path.join(__dirname,'..','public','v45-ticket-market-v36.js'),'utf8');"
              if source_anchor not in s: raise SystemExit('missing Stage26 source anchor')
              s=s.replace(source_anchor,source_new,1)
          if anchor not in s: raise SystemExit('missing Stage26 buy assertion anchor')
          p.write_text(s.replace(anchor,new,1))

          src=Path(path).read_text()
          if 'MutationObserver' in src: pass
          if src.count('setInterval')!=0: raise SystemExit('Item A must not add polling to v36')
          if "onclick=\"buyAtAsk(${priceOf(o)})\"" in src: raise SystemExit('legacy buyAtAsk wiring still present in rendered ask rows')
      - name: Syntax and focused validator
        run: |
          node --check public/v45-ticket-market-v36.js
          node --check scripts/validate-stage26-my-tickets.js
          node scripts/validate-stage26-my-tickets.js
      - name: Commit Item A and remove temporary workflow
        run: |
          rm .github/workflows/apply-stage6-item-a.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/v45-ticket-market-v36.js scripts/validate-stage26-my-tickets.js .github/workflows/apply-stage6-item-a.yml
          git commit -m 'Stage 6 Item A: replace prototype buy-offer flow'
          git push origin HEAD:stage6-item-a-investigate