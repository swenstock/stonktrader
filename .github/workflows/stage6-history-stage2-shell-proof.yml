name: Stage 6 History Stage 2 builder
on:
  push:
    branches: [stage6-history-stage2]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-history-stage2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-prove exact assembled shell
        run: |
          node <<'NODE'
          const { exactV45Shell } = require('./server/v45ExactShell');
          const html = exactV45Shell.toString('utf8');
          const counts = n => html.split(n).length - 1;
          console.log('EXACT V45 STAGE2 SHELL PROOF');
          for (const n of ['id="summaryBid"','id="summaryAsk"','id="summaryLast"','id="ticketTypeSelector"']) console.log(`${n} => ${counts(n)}`);
          const i=html.indexOf('id="summaryBid"');
          console.log(html.slice(i-120,i+500).replace(/\s+/g,' '));
          if(counts('id="summaryBid"')!==1||counts('id="summaryAsk"')!==1||counts('id="summaryLast"')!==1||counts('id="ticketTypeSelector"')!==1) process.exit(2);
          const snippet=html.slice(i-200,i+700);
          if(!snippet.includes('LAST SALE')||!snippet.includes('24H SALES')||!snippet.includes('class="market-summary"')) process.exit(3);
          NODE
      - name: Build Stage 2 stat-strip owner and regression
        run: |
          cat > public/v45-exchange-history-stage2-v1.js <<'JS'
          (()=>{
          'use strict';
          if(window.__SBC_EXCHANGE_HISTORY_STAGE2_V1)return;window.__SBC_EXCHANGE_HISTORY_STAGE2_V1=true;
          const $=(s,r=document)=>r.querySelector(s);
          let requestSeq=0;
          function activeMarket(){const active=$('#ticketTypeSelector .active');if(!active)return null;if(active.id==='sbcBadgeMarketTab')return'badge';const text=String(active.textContent||'').toUpperCase();if(/JR\.?\s*(STONK\s*)?BROKER|JUNIOR/.test(text))return'junior';if(text.includes('TRADER'))return'trader';if(text.includes('CLERK'))return'clerk';if(text.includes('RUNNER'))return'runner';return null;}
          function labelCell(cell,text){const span=cell?.querySelector?.('span');if(span)span.textContent=text;}
          function ensureStrip(){const bid=$('#summaryBid'),ask=$('#summaryAsk'),last=$('#summaryLast');if(!bid||!ask||!last)return null;const strip=bid.closest?.('.market-summary');if(!strip||ask.closest?.('.market-summary')!==strip||last.closest?.('.market-summary')!==strip)return null;const bidCell=bid.closest?.('.sum'),askCell=ask.closest?.('.sum'),lastCell=last.closest?.('.sum'),historyCell=lastCell?.nextElementSibling;if(!bidCell||!askCell||!lastCell||!historyCell)return null;labelCell(bidCell,'HIGHEST BID');labelCell(askCell,'LOWEST ASK');labelCell(lastCell,'LAST TRADE');let button=historyCell.querySelector?.('#sbcExchangeHistoryButton');if(!button){historyCell.textContent='';button=document.createElement('button');button.id='sbcExchangeHistoryButton';button.type='button';button.className='sbc-history-button';button.textContent='HISTORY';button.setAttribute?.('aria-label','Open Exchange transaction history');Object.assign(button.style||{}, {width:'100%',padding:'8px 10px',border:'1px solid #24465b',borderRadius:'8px',background:'rgba(42,181,255,.08)',color:'#2ab5ff',font:'inherit',fontWeight:'700',cursor:'pointer'});historyCell.appendChild(button);}return{strip,bid,ask,last,historyCell,button};}
          async function refreshLastTrade(){const ui=ensureStrip(),market=activeMarket();if(!ui)return null;if(!market){ui.last.textContent='—';return null;}const seq=++requestSeq;try{const r=await window.fetch(`/api/exchange-history?limit=1&offset=0&market=${encodeURIComponent(market)}`),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`History request failed (${r.status})`);if(seq!==requestSeq||activeMarket()!==market)return null;const row=Array.isArray(d.rows)?d.rows[0]:null;ui.last.textContent=row?.price==null?'—':Number(row.price).toLocaleString();ui.last.dataset&&(ui.last.dataset.sbcHistoryMarket=market);return row||null;}catch(_){if(seq===requestSeq&&activeMarket()===market)ui.last.textContent='—';return null;}}
          function refresh(){ensureStrip();return refreshLastTrade();}
          function boot(){refresh();}
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
          window.addEventListener?.('sbc:exchange-rendered',refresh);
          window.addEventListener?.('sbc:exchange-heartbeat',refresh);
          window.__SBC_EXCHANGE_HISTORY_STAGE2_TEST={activeMarket,ensureStrip,refreshLastTrade,refresh};
          })();
          JS

          cat > server/exchangeHistoryStage2Ui.test.js <<'JS'
          'use strict';
          const assert=require('assert'),fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('public/v45-exchange-history-stage2-v1.js','utf8');
          let active={id:'',textContent:'RUNNER YOU OWN 9'};
          const strip={};
          function cell(label){const span={textContent:label};return{span,children:[],textContent:'',querySelector(sel){if(sel==='span')return span;if(sel==='#sbcExchangeHistoryButton')return this.children.find(x=>x.id==='sbcExchangeHistoryButton')||null;return null;},appendChild(x){this.children.push(x);}}}
          const bidCell=cell('HIGHEST BID'),askCell=cell('LOWEST ASK'),lastCell=cell('LAST SALE'),historyCell=cell('24H SALES');lastCell.nextElementSibling=historyCell;
          function value(cell,text){return{textContent:text,dataset:{},closest(sel){if(sel==='.market-summary')return strip;if(sel==='.sum')return cell;return null;}}}
          const summaryBid=value(bidCell,'100'),summaryAsk=value(askCell,'110'),summaryLast=value(lastCell,'999');
          const listeners={};let lastUrl='';
          const document={readyState:'loading',querySelector(sel){return{'#ticketTypeSelector .active':active,'#summaryBid':summaryBid,'#summaryAsk':summaryAsk,'#summaryLast':summaryLast}[sel]||null;},createElement(tag){return{id:'',type:'',className:'',textContent:'',style:{},attrs:{},setAttribute(k,v){this.attrs[k]=v;}}},addEventListener(name,fn){listeners[name]=fn;}};
          const window={__SBC_EXCHANGE_HISTORY_STAGE2_V1:false,addEventListener(name,fn){listeners[name]=fn;},fetch:async url=>{lastUrl=String(url);const badge=lastUrl.includes('market=badge');return{ok:true,json:async()=>({rows:[{time:'2026-08-31T12:00:00Z',market:badge?'badge':'runner',price:badge?48000:125,buyer:'A',seller:'B',item:badge?'Jr Stonk Broker Badge':'Ticket #1'}]})};}};
          const context={window,document,console,encodeURIComponent,Number,String,Object,Array,RegExp,Math};vm.createContext(context);vm.runInContext(source,context);
          const api=window.__SBC_EXCHANGE_HISTORY_STAGE2_TEST;assert(api,'test API must exist');
          const ui=api.ensureStrip();assert(ui,'stat strip must resolve from real shell IDs');assert.strictEqual(bidCell.span.textContent,'HIGHEST BID');assert.strictEqual(askCell.span.textContent,'LOWEST ASK');assert.strictEqual(lastCell.span.textContent,'LAST TRADE');assert.strictEqual(historyCell.children.length,1);assert.strictEqual(historyCell.children[0].id,'sbcExchangeHistoryButton');assert.strictEqual(historyCell.children[0].textContent,'HISTORY');
          assert.strictEqual(api.activeMarket(),'runner');
          (async()=>{await api.refreshLastTrade();assert(lastUrl.includes('limit=1'));assert(lastUrl.includes('market=runner'));assert.strictEqual(summaryLast.textContent,'125');assert.strictEqual(summaryLast.dataset.sbcHistoryMarket,'runner');active={id:'sbcBadgeMarketTab',textContent:'JR STONK BROKER BADGE'};await api.refreshLastTrade();assert(lastUrl.includes('market=badge'));assert.strictEqual(summaryLast.textContent,'48,000');assert.strictEqual(summaryLast.dataset.sbcHistoryMarket,'badge');assert.strictEqual(typeof listeners['sbc:exchange-heartbeat'],'function','must reuse existing Exchange heartbeat');assert.strictEqual(typeof listeners['sbc:exchange-rendered'],'function','must refresh on selected-market render');assert(!source.includes('MutationObserver'));assert(!/setInterval\s*\(|setTimeout\s*\(/.test(source));console.log('Exchange History Stage 2 UI: PASS');console.log('RUNNER_LAST_TRADE=125');console.log('BADGE_LAST_TRADE=48,000');console.log('HISTORY_BUTTON=present-unwired');})();
          JS

          python3 <<'PY'
          from pathlib import Path
          p=Path('server/index.js');s=p.read_text()
          needle='<script src="/v45-badge-market-stage4.js?v=3"></script><script src="/v45-my-tickets-cleanup-v37.js?v=41"></script>'
          repl='<script src="/v45-badge-market-stage4.js?v=3"></script><script src="/v45-exchange-history-stage2-v1.js?v=1"></script><script src="/v45-my-tickets-cleanup-v37.js?v=41"></script>'
          assert s.count(needle)==1,s.count(needle);p.write_text(s.replace(needle,repl))
          p=Path('package.json');s=p.read_text()
          needle='npm run test:exchange-history-v1 && npm run test:badge-quantity-lock'
          assert s.count(needle)==1,s.count(needle);s=s.replace(needle,'npm run test:exchange-history-v1 && npm run test:exchange-history-stage2-ui && npm run test:badge-quantity-lock')
          needle2='    "test:exchange-history-v1": "node server/exchangeHistoryV1.test.js",\n'
          assert s.count(needle2)==1,s.count(needle2);s=s.replace(needle2,needle2+'    "test:exchange-history-stage2-ui": "node server/exchangeHistoryStage2Ui.test.js",\n')
          p.write_text(s)
          PY
      - name: Run focused Stage 2 proof
        run: node server/exchangeHistoryStage2Ui.test.js
      - name: Syntax check
        run: |
          node --check public/v45-exchange-history-stage2-v1.js
          node --check server/exchangeHistoryStage2Ui.test.js
          node --check server/index.js
      - name: Commit source only and remove builder
        run: |
          rm .github/workflows/stage6-history-stage2-shell-proof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/v45-exchange-history-stage2-v1.js server/exchangeHistoryStage2Ui.test.js server/index.js package.json .github/workflows/stage6-history-stage2-shell-proof.yml
          git commit -m "Add authoritative Exchange last-trade stat strip"
          git push origin HEAD:stage6-history-stage2
