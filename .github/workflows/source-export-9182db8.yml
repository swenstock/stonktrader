name: Export SBC Source 9182db8

on:
  push:
    branches: [v45-rebuild]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact deployed commit
        run: git fetch --depth=1 origin 9182db8ee7e0a43e20c9baaaa53d47883f2f87dd
      - name: Create exact source archive
        run: git archive --format=zip --output=STONKTRADER_FULL_SOURCE_9182db8.zip 9182db8ee7e0a43e20c9baaaa53d47883f2f87dd
      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: STONKTRADER_FULL_SOURCE_9182db8
          path: STONKTRADER_FULL_SOURCE_9182db8.zip
          if-no-files-found: error
          retention-days: 1
