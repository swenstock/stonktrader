name: Export SBC Source 6bf4d5c

on:
  push:
    branches: [v45-rebuild]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact current commit
        run: git fetch --depth=1 origin 6bf4d5cf2bda85a10452e09de62af74d49351be8
      - name: Create exact source archive
        run: git archive --format=zip --output=STONKTRADER_FULL_SOURCE_6bf4d5c.zip 6bf4d5cf2bda85a10452e09de62af74d49351be8
      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: STONKTRADER_FULL_SOURCE_6bf4d5c
          path: STONKTRADER_FULL_SOURCE_6bf4d5c.zip
          if-no-files-found: error
          retention-days: 1
