name: Stage 6 book stability builder

on:
  push:
    branches: [stage6-book-stability]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-book-stability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prove shell selectors and apply smallest diff
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { exactV45Shell } = require('./server/v45ExactShell');
          const html = Buffer.isBuffer(exactV45Shell) ? exactV45Shell.toString('utf8') : String(exactV45Shell);
          const count = s => html.split(s).length - 1;
          const cssGridMatches = html.match(/\.market-actions-v22\s*\{[^}]*display\s*:\s*grid[^}]*grid-template-columns\s*:\s*1fr\s+1fr[^}]*\}/g) || [];
          const proof = [
            ['class="market-actions-v22"', count('class="market-actions-v22"')],
            ['id="bidBook"', count('id="bidBook"')],
            ['id="askBook"', count('id="askBook"')],
            ['market-actions grid CSS rule', cssGridMatches.length],
          ];
          console.log('EXACT V45 SHELL PROOF');
          for (const [s,n] of proof) console.log(`${s} => ${n}`);
          if (proof.some(([,n]) => n !== 1)) throw new Error('assembled shell proof failed');

          const path = 'public/v45-exchange-layout-sales-v1.js';
          let src = fs.readFileSync(path, 'utf8');
          const oldScope = "function enforceBadgeScope(){const active=document.querySelector('#ticketTypeSelector .active'),on=active?.id==='sbcBadgeMarketTab',c=document.getElementById('sbcBadgeStage4Controls'),ticketActions=document.querySelector('.market-actions-v22');if(c)c.style.setProperty('display',on?'flex':'none','important');if(ticketActions)ticketActions.style.setProperty('display',on?'none':'flex','important');if(!on&&window.__SBC_BADGE_MARKET_STAGE4_TEST?.deactivateBadgeMode)window.__SBC_BADGE_MARKET_STAGE4_TEST.deactivateBadgeMode();return on;}";
          const newScope = "function ensureBookStabilityStyles(){let s=document.getElementById('sbcExchangeBookStabilityV1');if(s)return;s=document.createElement('style');s.id='sbcExchangeBookStabilityV1';s.textContent='#bidBook,#askBook{min-height:64px}#bidBook:empty::before,#askBook:empty::before{display:flex;align-items:center;min-height:64px;padding:12px;color:#7898aa;font-size:11px;box-sizing:border-box}#bidBook:empty::before{content:\"No active bids in this market.\"}#askBook:empty::before{content:\"No active offers in this market.\"}';document.head.appendChild(s);}\nfunction enforceBadgeScope(){const active=document.querySelector('#ticketTypeSelector .active'),on=active?.id==='sbcBadgeMarketTab',c=document.getElementById('sbcBadgeStage4Controls'),ticketActions=document.querySelector('.market-actions-v22');if(c)c.style.setProperty('display',on?'flex':'none','important');if(ticketActions){if(on)ticketActions.style.setProperty('display','none','important');else ticketActions.style.removeProperty('display');}if(!on&&window.__SBC_BADGE_MARKET_STAGE4_TEST?.deactivateBadgeMode)window.__SBC_BADGE_MARKET_STAGE4_TEST.deactivateBadgeMode();return on;}";
          const oldLayout = "function layout(){hideLegacyRecent();placePersonalStrip();placeUpgradeLadder();ensureRealRecent();enforceBadgeScope();}";
          const newLayout = "function layout(){hideLegacyRecent();placePersonalStrip();placeUpgradeLadder();ensureRealRecent();ensureBookStabilityStyles();enforceBadgeScope();}";
          if (src.split(oldScope).length - 1 !== 1) throw new Error('expected enforceBadgeScope baseline not found exactly once');
          if (src.split(oldLayout).length - 1 !== 1) throw new Error('expected layout baseline not found exactly once');
          src = src.replace(oldScope, newScope).replace(oldLayout, newLayout);
          fs.writeFileSync(path, src);
          console.log('PATCH PROOF');
          console.log('removeProperty(display) =>', (src.match(/removeProperty\('display'\)/g)||[]).length);
          console.log('empty bid selector =>', (src.match(/#bidBook:empty::before/g)||[]).length);
          console.log('empty ask selector =>', (src.match(/#askBook:empty::before/g)||[]).length);
          if (src.includes("ticketActions.style.setProperty('display',on?'none':'flex','important')")) throw new Error('bad flex restore remains');
          NODE
          node --check public/v45-exchange-layout-sales-v1.js
      - name: Commit source-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage6-book-stability-build.yml
          git add public/v45-exchange-layout-sales-v1.js
          git commit -m "Stage 6: stabilize empty ticket book layout"
          git push origin HEAD:stage6-book-stability
