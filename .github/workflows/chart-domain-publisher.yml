name: Chart Domain Publisher
on:
  push:
    branches: [chart-price-domain-v1]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chart-price-domain-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Apply chart price-domain fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing anchor in {path}: {old[:80]}')
              p.write_text(s.replace(old,new,1))

          p=Path('public/v45-desktop-stage45-v50.js'); s=p.read_text()
          s=s.replace("const st={x:1,y:1,pan:0,wheel:0,drag:false,axisDrag:false,startX:0,startY:0,startPan:0,startScale:1,surface:null,view:null};","const st={x:1,y:1,pan:0,wheel:0,drag:false,axisDrag:false,startX:0,startY:0,startPan:0,startScale:1,surface:null,view:null,raf:0};")
          s=s.replace("function apply(){if(!st.surface)return;st.pan=clamp(st.pan,-Math.max(0,(st.x-1)*180),Math.max(0,(st.x-1)*180));st.surface.style.transformOrigin='50% 50%';st.surface.style.transform=`translate3d(${st.pan}px,0,0) scaleX(${st.x}) scaleY(${st.y})`;st.surface.style.transition=(st.drag||st.axisDrag)?'none':'transform .14s ease-out';const r=$('.stage45-readout-v50',root());if(r)r.textContent=`${Math.round(st.x*100)}% TIME • ${Math.round(st.y*100)}% PRICE`;}","function apply(){if(!st.surface)return;st.pan=clamp(st.pan,-Math.max(0,(st.x-1)*180),Math.max(0,(st.x-1)*180));st.surface.style.transformOrigin='50% 50%';st.surface.style.transform=`translate3d(${st.pan}px,0,0) scaleX(${st.x})`;st.surface.style.transition=st.drag?'none':'transform .14s ease-out';const r=$('.stage45-readout-v50',root());if(r)r.textContent=`${Math.round(st.x*100)}% TIME • ${Math.round(st.y*100)}% PRICE`;}")
          s=s.replace("function fit(){st.x=1;st.y=1;st.pan=0;st.wheel=0;apply()}\nfunction price(d){st.y=clamp(Math.round((st.y+d)*100)/100,.55,2.4);apply()}","function repaintPrice(){if(st.raf)return;st.raf=requestAnimationFrame(()=>{st.raf=0;if(typeof window.renderSymbolChart==='function')window.renderSymbolChart();const c=root(),s=c&&surface(c);if(s){st.surface=s;apply();}})}\nfunction resetPrice(repaint=true){st.y=1;if(repaint)repaintPrice();}\nfunction fit(){st.x=1;st.y=1;st.pan=0;st.wheel=0;apply();repaintPrice()}\nfunction price(d){st.y=clamp(Math.round((st.y+d)*100)/100,.5,3);repaintPrice()}")
          s=s.replace("function controls(card){$('.stage44-chart-help-v49',card)?.classList.add('stage45-retire-v50');$('.stage45-scale-v50',card)?.remove();}","function controls(card){$('.stage44-chart-help-v49',card)?.classList.add('stage45-retire-v50');$('.stage45-scale-v50',card)?.remove();document.getElementById('advChartTrigger')?.remove();if(!card.dataset.stage45TfReset){card.dataset.stage45TfReset='1';card.addEventListener('click',e=>{if(e.target.closest('.chart-toolbar button'))resetPrice(false);},true);}}")
          s=s.replace("if(st.surface!==s){const first=!st.surface;st.surface=s;st.view=v;if(first)fit();else apply();}","if(st.surface!==s){st.surface=s;st.view=v;apply();}")
          s=s.replace("const next=st.startScale+(st.startY-e.clientY)/150;st.y=clamp(Math.round(next*100)/100,.55,2.4);apply();return;","const factor=Math.exp((st.startY-e.clientY)/220);st.y=clamp(Math.round(st.startScale*factor*100)/100,.5,3);repaintPrice();return;")
          s=s.replace("if(inPriceAxis(e,v)){st.y=1;apply();return;}","if(inPriceAxis(e,v)){resetPrice(true);return;}")
          s=s.replace("window.SBCChartViewportV50={fit,price,time,apply,state:st};","window.SBCChartViewportV50={fit,price,time,apply,resetPrice,repaintPrice,state:st};")
          p.write_text(s)

          p=Path('server/v45ExactShell.js'); s=p.read_text()
          anchor='    ["stroke-width=\\"1\\"", "stroke-width=\\"1.15\\""],\n'
          add=anchor+'    ["  const hi=Math.max(...data.map(d=>d.h));\\n  const lo=Math.min(...data.map(d=>d.l));\\n  const range=(hi-lo)||1;", "  const dataHi=Math.max(...data.map(d=>d.h));\\n  const dataLo=Math.min(...data.map(d=>d.l));\\n  const dataRange=(dataHi-dataLo)||1;\\n  const priceZoom=Math.max(.5,Math.min(3,Number(window.SBCChartViewportV50?.state?.y||1)));\\n  const priceCenter=(dataHi+dataLo)/2;\\n  const range=(dataRange*1.12)/priceZoom;\\n  const hi=priceCenter+range/2;\\n  const lo=priceCenter-range/2;"],\n'
          if anchor not in s: raise SystemExit('missing price-domain anchor')
          p.write_text(s.replace(anchor,add,1))

          p=Path('server/index.js'); s=p.read_text()
          s=s.replace('/v45-desktop-stage45-v50.js?v=51','/v45-desktop-stage45-v50.js?v=52')
          s=s.replace('<script src="/v45-advanced-chart-v1.js?v=1"></script>','')
          p.write_text(s)

          p=Path('server/chartPresentationConsolidationV1.test.js'); s=p.read_text()
          s=s.replace("assert(stage45.includes('window.SBCChartViewportV50={fit,price,time,apply,state:st}'), 'Stage45 must expose chart viewport capabilities');","assert(stage45.includes('window.SBCChartViewportV50={fit,price,time,apply,resetPrice,repaintPrice,state:st}'), 'Stage45 must expose chart viewport capabilities');")
          old="""assert(stage45.includes('st.startScale+(st.startY-e.clientY)/150'), 'vertical drag must continuously resize the price scale');\nassert(stage45.includes(\"if(inPriceAxis(e,v)){st.y=1;apply();return;}\"), 'double-clicking the price axis must reset price scale only');\nassert(stage45.includes(\"const first=!st.surface;st.surface=s;st.view=v;if(first)fit();else apply();\"), 'chart redraws must preserve existing X/Y scale instead of silently fitting every new surface');"""
          new="""assert(!stage45.includes('scaleY(${st.y})'), 'price scaling must not stretch the rendered SVG/canvas');\nassert(stage45.includes('repaintPrice')&&stage45.includes('window.renderSymbolChart'), 'price-axis interaction must rerender the chart domain');\nassert(stage45.includes('Math.exp((st.startY-e.clientY)/220)'), 'vertical drag must continuously resize the price domain');\nassert(stage45.includes(\"if(inPriceAxis(e,v)){resetPrice(true);return;}\"), 'double-clicking the price axis must reset price domain only');\nassert(stage45.includes(\"e.target.closest('.chart-toolbar button')\")&&stage45.includes('resetPrice(false)'), 'timeframe changes must return price range to clean autoscale before native rerender');\nassert(stage45.includes(\"document.getElementById('advChartTrigger')?.remove()\"), 'stale Advanced Chart launcher must be removed');"""
          if old not in s: raise SystemExit('missing old axis test block')
          s=s.replace(old,new,1)
          s=s.replace("assert(server.includes('/v45-desktop-stage43-v48.js?v=49')&&server.includes('/v45-desktop-stage45-v50.js?v=51')&&server.includes('/v45-desktop-stage46-v51-pre.js?v=71'), 'direct chart presentation assets must be cache-busted');","assert(server.includes('/v45-desktop-stage43-v48.js?v=49')&&server.includes('/v45-desktop-stage45-v50.js?v=52')&&server.includes('/v45-desktop-stage46-v51-pre.js?v=71'), 'direct chart presentation assets must be cache-busted');")
          marker="assert(!stageC.includes('new MutationObserver'), 'Stage C observer retirement must remain intact');"
          extra="""assert(shell.includes('const priceZoom=Math.max(.5,Math.min(3,Number(window.SBCChartViewportV50?.state?.y||1)))'), 'renderer must read price zoom into its price domain');\nassert(shell.includes('const range=(dataRange*1.12)/priceZoom'), 'renderer must scale price range mathematically instead of stretching pixels');\nassert(!server.includes('/v45-advanced-chart-v1.js?v=1'), 'standalone Advanced Chart launcher must no longer be injected');\n"""
          if marker not in s: raise SystemExit('missing test marker')
          s=s.replace(marker,extra+marker,1)
          p.write_text(s)
          PY
      - name: Validate focused chart behavior
        run: |
          node --check public/v45-desktop-stage45-v50.js
          node --check server/v45ExactShell.js
          node server/chartPresentationConsolidationV1.test.js
          node server/v45ExactShellRealBars.test.js
          node server/advancedChartStage6.test.js
          node server/advancedChartStage103AxisLock.test.js
      - name: Commit exact patch
        run: |
          rm .github/workflows/chart-domain-publisher.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/v45-desktop-stage45-v50.js server/v45ExactShell.js server/index.js server/chartPresentationConsolidationV1.test.js .github/workflows/chart-domain-publisher.yml
          git commit -m "Use renderer price-domain scaling and retire advanced chart launcher"
          git push origin HEAD:chart-price-domain-v1
