<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading current SBC Junior build…</title>
  <style>html,body{margin:0;min-height:100%;background:#020608;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center}.boot{opacity:.7;font-weight:800;letter-spacing:.08em}</style>
</head>
<body>
  <div class="boot">LOADING CURRENT SBC + JR PRIZE LAB…</div>
  <script>
  (async function(){
    try {
      const res = await fetch('/?jr-shell-source=1', { cache:'no-store' });
      if(!res.ok) throw new Error('Unable to load current SBC shell');
      let html = await res.text();
      html = html.replace('<head>', '<head><base href="/">');
      html = html.replace('</head>', '<link rel="stylesheet" href="/junior/junior-current.css?v=2"></head>');
      html = html.replace('</body>', '<script src="/junior/junior-current.js?v=2"><\/script></body>');
      document.open(); document.write(html); document.close();
    } catch (err) {
      document.body.innerHTML = '<div class="boot">CURRENT SBC SHELL COULD NOT LOAD. <a style="color:#ffc400" href="/">OPEN CURRENT SBC</a></div>';
    }
  })();
  </script>
</body>
</html>
